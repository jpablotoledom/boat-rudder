# Boat Rudder configuration - full key reference in
# develop_docs/reference/configuration.md
# Log levels: 0=none 1=error 2=warn 3=info 4=debug
verbose_level=4

# HTTP port
http_port=80

# HTTPS - set ssl_enabled=1 and provide cert/key paths to activate
https_port=443
ssl_enabled=1
ssl_cert=./ssl/cert.pem
ssl_key=./ssl/key.pem

# Comma-separated IPs of trusted reverse proxies (e.g. 127.0.0.1,10.0.0.1).
# X-Real-IP / X-Forwarded-For are honored only from these peers; empty means
# no proxy header is ever trusted.
trusted_proxies=

# Retro-compatible CMS: active theme (html/themes/<theme>/) and content language
theme=dark
lang=Eng

# Force a specific browser epoch for "/" instead of detecting it from
# User-Agent. -1=WML 0=pre-standard 1=early 2=middle 3=modern.
# Any other value (or omit this line) keeps auto-detection.
# force_epoch=2

# Public base URL of the site (reserved for future SEO/canonical links)
public_url=http://192.168.1.160

# MongoDB connection (login/sessions, epoch3 only). If the connection fails
# at startup, /login and /dashboard serve a 503 error page; the rest of the
# site (epoch CMS + static files) is unaffected.
mongodb_uri=mongodb://localhost:27017
mongodb_db=boat_rudder

# Session cookie lifetime, in seconds (default: 24h).
session_ttl_seconds=86400

# Anti-DDoS: global cap on concurrent connections, and a per-IP rate window
# + threshold with a temporary ban (2x the window) once exceeded.
# ddos_max_ips sizes the per-IP tracking table; once full, distinct new IPs
# go unlimited until the cleanup thread frees stale entries
# (ddos_cleanup_interval_secs / ddos_ip_stale_secs).
ddos_max_connections=200
ddos_rate_window_secs=5
ddos_rate_limit=500
ddos_max_ips=1024
ddos_cleanup_interval_secs=60
ddos_ip_stale_secs=300

# Per-connection read/write timeout, in seconds (slow-loris defense).
connection_io_timeout_secs=5

# WAP 1.x gateway: answers vintage WAP browsers with this site as epoch -1
# (WML compiled to WBXML), whatever host they request. Those browsers are
# hardwired to a dead operator gateway IP; trc-wap-relay, running on the PC
# the device connects through, claims that IP there and relays the traffic
# here, so this server just listens on its own address(es).
# wap_gateway_ips: addresses to listen on, comma-separated (empty = all).
# Ports: 49300 = Palm Neomar/Rover 1.5, 9200 = standard connectionless WSP
# (experimental, untested on real phones). 0 disables a port.
wap_gateway_enabled=1
wap_gateway_ips=
wap_gateway_rover_port=49300
wap_gateway_wsp_port=9200
# Requests answered per minute per source IP (0 = unlimited). UDP replies
# are ~20x the request, so an open gateway without a cap can be abused to
# flood a spoofed address; a real phone stays far below this.
wap_gateway_rate_limit=60
