<section class="boat-rudder-dashboard__panel">
  <div class="boat-rudder-dashboard__panel-header">
    <h2>Analytics</h2>
    <div class="boat-rudder-dashboard__panel-actions">
      <a class="boat-rudder-btn" href="/dashboard/analytics?period=range&amp;from=%s&amp;to=%s">Full report</a>
    </div>
  </div>

  <div class="boat-rudder-analytics__totals">
    <div class="boat-rudder-analytics__stat-card boat-rudder-card">
      <div class="boat-rudder-analytics__stat-value">%d</div>
      <div class="boat-rudder-analytics__stat-label boat-rudder-caption">Visits today</div>
    </div>
    <div class="boat-rudder-analytics__stat-card boat-rudder-card">
      <div class="boat-rudder-analytics__stat-value">%d</div>
      <div class="boat-rudder-analytics__stat-label boat-rudder-caption">Visits, last 7 days</div>
    </div>
  </div>

  <div class="boat-rudder-analytics__table-block boat-rudder-analytics__table-block--chart boat-rudder-card">
    <div class="boat-rudder-analytics__table-title boat-rudder-caption">Visits per day</div>
    %s
  </div>

  <div class="boat-rudder-analytics__grid">
    <div class="boat-rudder-analytics__table-block boat-rudder-card">
      <div class="boat-rudder-analytics__table-title boat-rudder-caption">Top 5 blog articles &middot; 7 days</div>
      %s
      <details class="boat-rudder-chart__table">
        <summary>Table</summary>
        %s
      </details>
    </div>
    <div class="boat-rudder-analytics__table-block boat-rudder-card">
      <div class="boat-rudder-analytics__table-title boat-rudder-caption">Visits by epoch &middot; 7 days</div>
      %s
      <details class="boat-rudder-chart__table">
        <summary>Table</summary>
        %s
      </details>
    </div>
    <div class="boat-rudder-analytics__table-block boat-rudder-card">
      <div class="boat-rudder-analytics__table-title boat-rudder-caption">Top 5 browsers &middot; 7 days</div>
      %s
      <details class="boat-rudder-chart__table">
        <summary>Table</summary>
        %s
      </details>
    </div>
    <div class="boat-rudder-analytics__table-block boat-rudder-card">
      <div class="boat-rudder-analytics__table-title boat-rudder-caption">Top 5 countries &middot; 7 days</div>
      %s
      <details class="boat-rudder-chart__table">
        <summary>Table</summary>
        %s
      </details>
    </div>
  </div>
</section>
