<section class="boat-rudder__dashboard__panel">
  <div class="boat-rudder__dashboard__panel-header">
    <h2>Analytics</h2>
    <div class="boat-rudder__dashboard__panel-actions">
      <a class="boat-rudder__dashboard__button" href="/dashboard/analytics?period=range&amp;from=%s&amp;to=%s">Full report</a>
    </div>
  </div>

  <div class="boat-rudder__analytics__totals">
    <div class="boat-rudder__analytics__stat-card">
      <div class="boat-rudder__analytics__stat-value">%d</div>
      <div class="boat-rudder__analytics__stat-label">Visits today</div>
    </div>
    <div class="boat-rudder__analytics__stat-card">
      <div class="boat-rudder__analytics__stat-value">%d</div>
      <div class="boat-rudder__analytics__stat-label">Visits, last 7 days</div>
    </div>
  </div>

  <div class="boat-rudder__analytics__table-block boat-rudder__analytics__table-block--chart">
    <div class="boat-rudder__analytics__table-title">Visits per day</div>
    %s
  </div>

  <div class="boat-rudder__analytics__grid">
    <div class="boat-rudder__analytics__table-block">
      <div class="boat-rudder__analytics__table-title">Top 5 blog articles &middot; 7 days</div>
      %s
      <details class="boat-rudder__chart__table">
        <summary>Table</summary>
        %s
      </details>
    </div>
    <div class="boat-rudder__analytics__table-block">
      <div class="boat-rudder__analytics__table-title">Visits by epoch &middot; 7 days</div>
      %s
      <details class="boat-rudder__chart__table">
        <summary>Table</summary>
        %s
      </details>
    </div>
    <div class="boat-rudder__analytics__table-block">
      <div class="boat-rudder__analytics__table-title">Top 5 browsers &middot; 7 days</div>
      %s
      <details class="boat-rudder__chart__table">
        <summary>Table</summary>
        %s
      </details>
    </div>
    <div class="boat-rudder__analytics__table-block">
      <div class="boat-rudder__analytics__table-title">Top 5 countries &middot; 7 days</div>
      %s
      <details class="boat-rudder__chart__table">
        <summary>Table</summary>
        %s
      </details>
    </div>
  </div>
</section>
