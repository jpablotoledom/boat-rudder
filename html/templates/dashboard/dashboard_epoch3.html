<section class="boat-rudder__dashboard">
<h1>Welcome to dashboard</h1>
%s
<h2>Entries</h2>
<form method="POST" action="/dashboard/entries/new">
  <button class="boat-rudder__dashboard__button" type="submit">+ New entry</button>
</form>
<table class="boat-rudder__dashboard__table">
  <thead>
    <tr>
      <th>Image</th>
      <th>Title</th>
      <th>Type</th>
      <th>Summary</th>
      <th>Author</th>
      <th>Date</th>
      <th>Categories</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
%s
  </tbody>
</table>
</section>
