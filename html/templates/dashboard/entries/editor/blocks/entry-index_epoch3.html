    <div class="boat-rudder-entry-editor-block" data-block-id="%s" data-type="entry-index" onclick="activateBlock(this)">

      <div class="boat-rudder-entry-editor-block__header">
        <span class="boat-rudder-entry-editor-block__type-label boat-rudder-entry-editor-block__type-label--entry-index">&#9783; Article index</span>
