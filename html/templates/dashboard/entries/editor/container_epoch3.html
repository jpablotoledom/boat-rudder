    var type = block.dataset.type;
    if (type === 'paragraph') initParagraphEditors(block);
    if (type === 'title') {
      initBlockHeadingBtns(block);
      block.querySelectorAll('[name="text"]').forEach(function (ta) {
        ta.rows = 1;
        ta.placeholder = 'Heading';
      });
      autosizeTitle(block);
    }
  }

  /* ---- Advanced panel ---- */
  window.toggleAdvanced = function (btn) {
    var panel = btn.nextElementSibling;
    if (!panel) return;
    var isOpen = panel.classList.contains('boat-rudder-entry-editor-advanced__panel--open');
    panel.classList.toggle('boat-rudder-entry-editor-advanced__panel--open', !isOpen);
    btn.innerHTML = isOpen ? '&#9881; Advanced &#9656;' : '&#9881; Advanced &#9662;';
    if (!isOpen) {
      var block = btn.closest('.boat-rudder-entry-editor-block');
      var hidden = block && block.querySelector('[name="extra_data"]');
      var visible = panel.querySelector('.boat-rudder-entry-editor-advanced__input');
      if (hidden && visible) visible.value = hidden.value;
      var typeHidden = block && block.querySelector('[name="block_type"]');
      var typeVisible = panel.querySelector('.boat-rudder-entry-editor-advanced__type-input');
      if (typeHidden && typeVisible) typeVisible.value = typeHidden.value;
    }
  };

  window.syncAdvancedInput = function (input) {
    var block = input.closest('.boat-rudder-entry-editor-block');
    if (!block) return;
    var hidden = block.querySelector('[name="extra_data"]');
    if (hidden) hidden.value = input.value;
    setContentChanged();
  };

  /* ---- Content changed / autosave ---- */
  window.setContentChanged = function () {
    dirty = true;
    if (autoSaveEnabled) editorScheduleAutoSave();
  };

  function editorScheduleAutoSave() {
    if (autoSaveTimer) clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(function () { editorSaveAll(); }, 3000);
  }

  window.onBlockInput = function (el) {
    var block = el.closest('.boat-rudder-entry-editor-block');
    if (block) refreshBlockPreview(block);
    setContentChanged();
  };

  /* ---- Save functions ---- */
  window.saveMeta = function () {
    var sidebar = document.getElementById('metaSidebar');
    var params = new URLSearchParams();
    params.set('link', sidebar.querySelector('[name="link"]').value);
    params.set('type', sidebar.querySelector('[name="type"]').value);
    if (sidebar.querySelector('[name="enabled"]').checked) params.set('enabled', 'true');
    var selected = sidebar.querySelector('[name="categories"]').selectedOptions;
    for (var i = 0; i < selected.length; i++) params.append('categories', selected[i].value);
    return postForm(apiUrl('/meta'), params).then(function (data) {
      setStatus(data.ok ? 'Settings saved' : 'Error: ' + data.error, data.ok ? 'saved' : 'error');
      return data;
    });
  };

  window.saveHeader = function () {
    var sidebar = document.getElementById('headerSidebar');
    var params = new URLSearchParams();
    params.set('image_url', sidebar.querySelector('[name="image_url"]').value);
    params.set('date', sidebar.querySelector('[name="date"]').value);
    // Sent explicitly as 1/0: an unchecked checkbox submits nothing on its own,
    // so the server could not tell "unchecked" from "field absent".
    var hideAuthor = sidebar.querySelector('[name="hide_author"]');
    params.set('hide_author', hideAuthor && hideAuthor.checked ? '1' : '0');
    var commentsClosed = sidebar.querySelector('[name="comments_closed"]');
    params.set('comments_closed', commentsClosed && commentsClosed.checked ? '1' : '0');
    for (var i = 0; i < langs.length; i++) {
      var code = langs[i];
      var panel = sidebar.querySelector('.boat-rudder-entry-editor-block__lang-content[data-lang="' + code + '"]');
      if (!panel) continue;
      params.set('title_' + code, panel.querySelector('[name="title"]').value);
      params.set('summary_' + code, panel.querySelector('[name="summary"]').value);
    }
    return postForm(apiUrl('/header'), params).then(function (data) {
      setStatus(data.ok ? 'Header saved' : 'Error: ' + data.error, data.ok ? 'saved' : 'error');
      return data;
    });
  };

  window.saveContent = function () {
    var blocks = document.querySelectorAll('#entryBlocks .boat-rudder-entry-editor-block');
    var params = new URLSearchParams();
    params.set('content_count', blocks.length);
    for (var i = 0; i < blocks.length; i++) {
      var blockEl = blocks[i];
      params.set('content_' + i + '_id', blockEl.dataset.blockId);
      params.set('content_' + i + '_type', blockEl.dataset.type);
      params.set('content_' + i + '_order', i);
      var extraField = blockEl.querySelector('[name="extra_data"]');
      params.set('content_' + i + '_extra_data', extraField ? extraField.value : '');
      for (var j = 0; j < langs.length; j++) {
        var code = langs[j];
        var panel = blockEl.querySelector('.boat-rudder-entry-editor-block__lang-content[data-lang="' + code + '"]');
        var textField = panel ? panel.querySelector('[name="text"]') : null;
        params.set('content_' + i + '_text_' + code, textField ? textField.value : '');
      }
    }
    return postForm(apiUrl('/content'), params).then(function (data) {
      // Blocks stored before content[]._id existed come back with a server-minted
      // id; adopt it so per-block delete and gallery edits target the right block.
      if (data.ok && data.ids) {
        for (var k = 0; k < blocks.length && k < data.ids.length; k++) {
          if (data.ids[k]) blocks[k].dataset.blockId = data.ids[k];
        }
      }
      setStatus(data.ok ? 'Content saved' : 'Error: ' + data.error, data.ok ? 'saved' : 'error');
      return data;
    });
  };

  // `retried`: already a second try, after fetching a newer session's token.
  window.editorSaveAll = function (retried) {
    setStatus('Saving...');
    return Promise.all([saveMeta(), saveHeader(), saveContent()]).then(function (results) {
      var failed = results.filter(function (data) { return !data.ok; });
      dirty = failed.length > 0;
      setStatus(dirty ? 'Save failed: ' + (failed[0].error || 'unknown error') : 'Saved', dirty ? 'error' : 'saved');
    }, function (err) {
      dirty = true;
      // Signed in again in another tab: this page still sends the old
      // session's token. Take the new one and save once more.
      if (err.session === 'csrf' && retried !== true) {
        return checkSession().then(function (ok) {
          if (ok) return editorSaveAll(true);
          if (ok === null) setStatus('Not saved: no answer from the server', 'error');
        });
      }
      if (err.session) sessionLost();
      else setStatus('Not saved: ' + (err.message || 'no answer from the server'), 'error');
    });
  };

  /* ---- Translation ---- */
  // Fills the other languages' empty fields from the one being edited
  // (entry-translation-plan.md). Azure goes through the server, which holds
  // the key; a local translator is called straight from here, since the
  // server can't reach the editor's computer. Either way translateBatch()
  // turns a list of texts into a list of translations.
  var translateProvider = root.dataset.translateProvider || '';
  var translateBusy = false;
  var TRANSLATE_MAX_TEXTS = 50;
  var TRANSLATE_MAX_CHARS = 40000;

  function langName(code) {
    var btn = root.querySelector('.boat-rudder-entry-editor__lang-btn[data-lang="' + code + '"]');
    return btn ? btn.textContent.trim() : code;
  }

  if (translateProvider && langs.length > 1) document.getElementById('translateBox').hidden = false;

  window.toggleTranslatePanel = function () {
    var panel = document.getElementById('translatePanel');
    if (panel.classList.contains('boat-rudder-entry-editor-translate__panel--open')) { closeTranslatePanel(); return; }
    translateMessage('');
    document.getElementById('translateFrom').textContent = langName(currentLang);
    document.getElementById('translateTargets').innerHTML = langs.filter(function (code) {
      return code !== currentLang;
    }).map(function (code) {
      return '<label class="boat-rudder-entry-editor-translate__target"><input type="checkbox" value="' +
        escapeHtml(code) + '" checked> ' + escapeHtml(langName(code)) + '</label>';
    }).join('');
    // Off every time the panel opens: replacing is the exception, and a
    // checkbox left on from an earlier run would overwrite by surprise.
    document.getElementById('translateOverwrite').checked = false;
    updateTranslateHint();
    panel.classList.add('boat-rudder-entry-editor-translate__panel--open');
  };

  window.updateTranslateHint = function () {
    document.getElementById('translateHint').textContent = document.getElementById('translateOverwrite').checked
      ? 'Every field is translated again from ' + langName(currentLang) + ', replacing what the other languages have.'
      : 'Only empty fields are filled; what is already written stays.';
  };

  function closeTranslatePanel() {
    var panel = document.getElementById('translatePanel');
    if (!panel || !panel.classList.contains('boat-rudder-entry-editor-translate__panel--open')) return false;
    panel.classList.remove('boat-rudder-entry-editor-translate__panel--open');
    return true;
  }
  window.closeTranslatePanel = closeTranslatePanel;

  // The panel's own line: progress, and why a run stopped or did nothing -
  // the top bar's status alone is easy to miss.
  function translateMessage(text, cls) {
    var el = document.getElementById('translateMessage');
    el.textContent = text;
    el.className = 'boat-rudder-entry-editor-translate__message' +
      (cls ? ' boat-rudder-entry-editor-translate__message--' + cls : '');
  }

  function translateBatch(texts, source, target, format) {
    if (translateProvider === 'azure') {
      var params = new URLSearchParams();
      params.set('source', source);
      params.set('target', target);
      params.set('format', format);
      texts.forEach(function (t) { params.append('text', t); });
      return postForm('/dashboard/api/translate', params).then(function (data) {
        if (!data.ok) throw new Error(data.error || 'translation failed');
        return data.texts;
      });
    }
    var url = (root.dataset.translateUrl || '').replace(/\/+$/, '') + '/translate';
    var body = { q: texts, source: source, target: target, format: format };
    if (root.dataset.translateKey) body.api_key = root.dataset.translateKey;
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).catch(function () {
      throw new Error('the local translator at ' + url + ' did not answer');
    }).then(function (res) {
      return res.json().catch(function () { throw new Error('the local translator answered ' + res.status); });
    }).then(function (data) {
      if (data.error) throw new Error(data.error);
      var out = Array.isArray(data.translatedText) ? data.translatedText : [data.translatedText];
      if (out.length !== texts.length) throw new Error('the local translator answered a different number of texts');
      return out;
    });
  }

  function langField(scope, lang, name) {
    var panel = scope.querySelector('.boat-rudder-entry-editor-block__lang-content[data-lang="' + lang + '"]');
    return panel ? panel.querySelector('[name="' + name + '"]') : null;
  }

  // An opened table block shows a starter grid ("Column 1"...) even in a
  // language nobody has written yet; that still counts as empty.
  function isBlankTable(text) {
    return text.split('\n').every(function (row) {
      return row.split('|').every(function (c) { return !c.trim() || /^Column \d+$/.test(c.trim()); });
    });
  }

  // The jobs of one target language: each has a format, the texts to send
  // and apply(translations). Only fields empty in `target` - or every one,
  // with `overwrite` - whose `source` has text; a list goes line by line and
  // a table cell by cell, so their separators survive.
  function translationJobs(source, target, overwrite) {
    var jobs = [];
    var header = document.getElementById('headerSidebar');
    var written = function (value) { return !overwrite && value.trim(); };
    ['title', 'summary'].forEach(function (name) {
      var from = langField(header, source, name), to = langField(header, target, name);
      if (!from || !to || !from.value.trim() || written(to.value)) return;
      jobs.push({ format: 'text', texts: [from.value], apply: function (t) { to.value = t[0]; } });
    });

    document.querySelectorAll('#entryBlocks .boat-rudder-entry-editor-block').forEach(function (block) {
      var type = block.dataset.type;
      var from = langField(block, source, 'text'), to = langField(block, target, 'text');
      if (!from || !to || !from.value.trim()) return;
      var done = function (value) {
        to.value = value;
        refreshBlockPreview(block);
      };
      if (type === 'paragraph') {
        if (written(to.value)) return;
        jobs.push({ format: 'html', texts: [from.value], apply: function (t) {
          setParagraphText(block, target, t[0]);
          refreshBlockPreview(block);
        } });
      } else if (type === 'title' || type === 'link') {
        if (written(to.value)) return;
        jobs.push({ format: 'text', texts: [from.value], apply: function (t) { done(t[0]); } });
      } else if (type === 'list' || type === 'table') {
        if (!overwrite && (type === 'list' ? to.value.trim() : !isBlankTable(to.value))) return;
        var sep = type === 'list' ? null : '|';
        var rows = from.value.replace(/\r\n?/g, '\n').split('\n');
        var cells = rows.map(function (row) { return sep ? row.split(sep) : [row]; });
        var texts = [];
        cells.forEach(function (row) { row.forEach(function (c) { if (c.trim()) texts.push(c); }); });
        jobs.push({ format: 'text', texts: texts, apply: function (t) {
          var i = 0;
          done(cells.map(function (row) {
            return row.map(function (c) { return c.trim() ? t[i++] : c; }).join(sep || '');
          }).join('\n'));
          var grid = to.parentNode.querySelector('.boat-rudder-entry-editor__table-editor');
          if (grid) buildTableGrid(grid, parseTableRows(to.value), tableHasHeader(block), to);
        } });
      } else if (type === 'code-text' || type === 'terminal') {
        // Code and commands are the same in every language - a translator
        // would rename keywords, paths and options - so they are copied as
        // they are, or the block would show nothing in the other language.
        if (written(to.value)) return;
        jobs.push({ format: 'copy', texts: [from.value], apply: function (t) { done(t[0]); } });
      }
    });
    return jobs;
  }

  // Sends `jobs` in batches of up to TRANSLATE_MAX_TEXTS texts per format,
  // one after another, then hands each job its translations and calls
  // applied() for it.
  function runJobs(jobs, source, target, progress, applied) {
    // Copied fields (code, terminal) need no translator: filled right away.
    jobs.filter(function (j) { return j.format === 'copy'; }).forEach(function (job) {
      job.apply(job.texts);
      applied();
    });
    var batches = [];
    ['text', 'html'].forEach(function (format) {
      var batch = null;
      jobs.filter(function (j) { return j.format === format; }).forEach(function (job) {
        var size = job.texts.join('').length;
        if (!batch || batch.texts.length + job.texts.length > TRANSLATE_MAX_TEXTS ||
            batch.size + size > TRANSLATE_MAX_CHARS) {
          batch = { format: format, texts: [], jobs: [], size: 0 };
          batches.push(batch);
        }
        batch.jobs.push(job);
        batch.texts = batch.texts.concat(job.texts);
        batch.size += size;
      });
    });
    return batches.reduce(function (chain, batch, i) {
      return chain.then(function () {
        progress(i + 1, batches.length);
        return translateBatch(batch.texts, source, target, batch.format).then(function (out) {
          var at = 0;
          batch.jobs.forEach(function (job) {
            job.apply(out.slice(at, at + job.texts.length));
            at += job.texts.length;
            applied();
          });
        });
      });
    }, Promise.resolve());
  }

  window.runTranslation = function () {
    if (translateBusy) return;
    var source = currentLang;
    var targets = Array.from(document.querySelectorAll('#translateTargets input:checked'))
      .map(function (cb) { return cb.value; });
    var overwrite = document.getElementById('translateOverwrite').checked;
    var work = targets.map(function (target) {
      return { target: target, jobs: translationJobs(source, target, overwrite) };
    }).filter(function (w) { return w.jobs.length; });
    if (overwrite && work.length && !confirm('Replace everything already written in ' +
        work.map(function (w) { return langName(w.target); }).join(', ') + ' with a new translation from ' +
        langName(source) + '?')) return;
    if (!work.length) {
      translateMessage('Nothing to translate: no field written in ' + langName(source) +
        ' is empty in the other languages. Write in the tab you translate from.', 'error');
      return;
    }

    translateBusy = true;
    var filled = 0;
    work.reduce(function (chain, w) {
      return chain.then(function () {
        return runJobs(w.jobs, source, w.target, function (i, n) {
          var text = 'Translating to ' + langName(w.target) + (n > 1 ? ' ' + i + '/' + n : '') + '...';
          setStatus(text);
          translateMessage(text);
        }, function () { filled++; });
      });
    }, Promise.resolve()).then(function () {
      translateBusy = false;
      closeTranslatePanel();
      setContentChanged();
      if (autoSaveEnabled) {
        clearTimeout(autoSaveTimer);
        editorSaveAll();
      } else {
        setStatus('Translated ' + filled + ' field' + (filled === 1 ? '' : 's') + ' - not saved yet', 'saved');
      }
    }, function (err) {
      translateBusy = false;
      if (filled) setContentChanged();
      setStatus('Translation stopped: ' + err.message, 'error');
      translateMessage('Translation stopped: ' + err.message, 'error');
    });
  };

  /* ---- Add / remove blocks ---- */
  window.toggleAddBlockDropdown = function (opener) {
    var menu = document.getElementById('addBlockMenu');
    // One menu serves the context bar's "+ Insert" and the sheet's
    // "+ Add block": it moves next to the button that opened it.
    if (opener && opener.nextElementSibling !== menu) {
      opener.after(menu);
      menu.classList.remove('boat-rudder-entry-editor-add-block__dropdown--open');
    }
    var opening = !menu.classList.contains('boat-rudder-entry-editor-add-block__dropdown--open');
    menu.classList.toggle('boat-rudder-entry-editor-add-block__dropdown--open', opening);
    if (!opening) return;
    if (menu.closest('.boat-rudder-entry-editor-context')) return;  // always opens downward there

    // The menu opens upward, since the button sits under the last block. The
    // editor area scrolls (overflow-y: auto), so with little or nothing above
    // the button - an entry with no blocks yet - an upward menu is clipped
    // out of sight: open it downward then, scrolled into view.
    var down = 'boat-rudder-entry-editor-add-block__dropdown--down';
    menu.classList.remove(down);
    var btn = menu.previousElementSibling;
    var scroller = menu.closest('.boat-rudder-entry-editor__main');
    var roomAbove = btn.getBoundingClientRect().top -
                    (scroller ? scroller.getBoundingClientRect().top : 0);
    if (menu.offsetHeight + 4 > roomAbove) {
      menu.classList.add(down);
      menu.scrollIntoView({ block: 'nearest' });
    }
  };

  // Creates a block of `type` server-side right after `anchor` (or at the
  // end when there's none) - or right before `before`, when given - puts it
  // on the page and resolves with its element, or null on failure. Shared by
  // the add-block buttons, splitParagraph() and the keyboard.
  function createBlockAfter(anchor, type, before) {
    var blocksEl = document.getElementById('entryBlocks');
    var order = before ? Array.from(blocksEl.children).indexOf(before)
              : anchor ? Array.from(blocksEl.children).indexOf(anchor) + 1 : blocksEl.children.length;
    var params = new URLSearchParams();
    params.set('type', type);
    params.set('order', order);

    return postForm(apiUrl('/blocks'), params).then(function (data) {
      if (!data.ok) {
        setStatus('Error: ' + data.error, 'error');
        return null;
      }
      var wrapper = document.createElement('div');
      wrapper.innerHTML = data.html;
      var blockEl = wrapper.firstElementChild;
      if (before && before.parentNode === blocksEl) {
        before.before(blockEl);
      } else if (anchor && anchor.parentNode === blocksEl) {
        anchor.after(blockEl);
      } else {
        blocksEl.appendChild(blockEl);
      }
      applyLangVisibility(blockEl);
      initInlineBlock(blockEl);
      setupDragHandles();
      setContentChanged();
      return blockEl;
    });
  }

  window.insertNewComponent = function (type) {
    // New blocks land right after whichever one is currently selected, not
    // always at the end - captured now, since activateBlock() below will
    // clear activeEditBlock once the new block takes its place.
    var anchor = activeEditBlock;
    // An empty paragraph (where Enter just landed) becomes the new block.
    if (isEmptyParagraph(anchor) && type !== 'paragraph') {
      closeAddBlockMenu();
      convertBlock(anchor, type).then(function (nb) { if (nb) enterBlock(nb); });
      return;
    }
    createBlockAfter(anchor, type).then(function (blockEl) {
      if (!blockEl) return;
      refreshBlockPreview(blockEl);
      var menu = document.getElementById('addBlockMenu');
      if (menu) menu.classList.remove('boat-rudder-entry-editor-add-block__dropdown--open');
      activateBlock(blockEl);
      blockEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      var field = blockEl.querySelector('.boat-rudder-entry-editor-block__lang-content--active .boat-rudder-entry-editor__richtext, ' +
                                        '.boat-rudder-entry-editor-block__lang-content--active textarea');
      if (field && isInlineType(blockEl.dataset.type)) field.focus({ preventScroll: true });
    });
  };

  window.removeComponent = function (btn) {
    var blockEl = btn.closest('.boat-rudder-entry-editor-block');
    var blockId = blockEl.dataset.blockId;
    postForm(apiUrl('/blocks/' + blockId + '/delete'), new URLSearchParams()).then(function (data) {
      if (data.ok) {
        if (activeEditBlock === blockEl) activeEditBlock = null;
        blockEl.remove();
        updateContextBar();
        setContentChanged();
      } else {
        setStatus('Error: ' + data.error, 'error');
      }
    });
  };

  /* ---- Move blocks ---- */
  window.moveBlockUp = function (btn) {
    var blockEl = btn.closest('.boat-rudder-entry-editor-block');
    var prev = blockEl.previousElementSibling;
    if (prev) blockEl.parentNode.insertBefore(blockEl, prev);
    setContentChanged();
  };

  window.moveBlockDown = function (btn) {
    var blockEl = btn.closest('.boat-rudder-entry-editor-block');
    var next = blockEl.nextElementSibling;
    if (next) blockEl.parentNode.insertBefore(next, blockEl);
    setContentChanged();
  };

  /* ---- Drag and drop ---- */
  var dragging = null, clone = null, placeholder = null, dragOffsetY = 0;

  function getBlockRows() {
    return Array.from(document.querySelectorAll('#entryBlocks > .boat-rudder-entry-editor-block'));
  }

  function setupDragHandles() {
    getBlockRows().forEach(function (row) {
      // The open block's whole header bar drags too, from any spot that
      // isn't one of its own controls (trash, Split/Merge, move, close...).
      var grips = [row.querySelector('.boat-rudder-entry-editor-block__grip')].filter(Boolean);
      grips.forEach(function (grip) {
        if (grip.dataset.dragInit) return;
        grip.dataset.dragInit = '1';
        grip.addEventListener('mousedown', function (e) {
          if (e.button !== 0) return;
          if (e.target.closest('button, input, select, textarea, a, label')) return;
          e.preventDefault();
          e.stopPropagation();
          dragging = row;
          var rect = row.getBoundingClientRect();
          dragOffsetY = e.clientY - rect.top;

          placeholder = document.createElement('div');
          placeholder.style.cssText = 'height:4px;background:rgba(37,99,235,0.6);border-radius:2px;margin:2px 0;pointer-events:none;';

          clone = row.cloneNode(true);
          // An open block's tool row is pinned to the context bar; the
          // dragged copy must not put a second one there.
          clone.classList.remove('boat-rudder-entry-editor-block--editing');
          clone.style.cssText = 'position:fixed;left:' + rect.left + 'px;top:' + rect.top + 'px;width:' + rect.width + 'px;opacity:0.88;pointer-events:none;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,0.5);background:#222;border:1px solid #2563eb;border-radius:5px;box-sizing:border-box';

          document.body.appendChild(clone);
          row.after(placeholder);
          row.style.cssText += ';visibility:hidden;height:4px;overflow:hidden;margin:0;padding:0;';
          document.body.classList.add('boat-rudder-entry-editor-mode--dragging');
        });
      });
    });
  }

  document.addEventListener('mousemove', function (e) {
    if (!dragging || !clone) return;
    e.preventDefault();
    clone.style.top = (e.clientY - dragOffsetY) + 'px';
    var rows = getBlockRows().filter(function (r) { return r !== dragging; });
    var inserted = false;
    for (var i = 0; i < rows.length; i++) {
      var rect = rows[i].getBoundingClientRect();
      if (e.clientY < rect.top + rect.height / 2) {
        rows[i].before(placeholder);
        inserted = true;
        break;
      }
    }
    if (!inserted && placeholder.parentNode) {
      document.getElementById('entryBlocks').appendChild(placeholder);
    }
  });

  document.addEventListener('mouseup', function () {
    if (!dragging) return;
    if (placeholder && placeholder.parentNode) {
      placeholder.parentNode.insertBefore(dragging, placeholder);
    }
    dragging.style.cssText = dragging.style.cssText
      .replace(/visibility:[^;]+;?/g, '')
      .replace(/height:[^;]+;?/g, '')
      .replace(/overflow:[^;]+;?/g, '')
      .replace(/margin:[^;]+;?/g, '')
      .replace(/padding:[^;]+;?/g, '');
    if (clone) clone.remove();
    if (placeholder) placeholder.remove();
    document.body.classList.remove('boat-rudder-entry-editor-mode--dragging');
    dragging = null; clone = null; placeholder = null;
    updateContextBar();
    setContentChanged();
  });

  /* ---- Preview post ---- */
  // Opens the entry's public URL - drafts included, since the server shows
  // unpublished entries to anyone signed in to the dashboard (marked
  // "[Draft]" in the title). Pages live under /page/, posts under /blog/.
  window.openBlogPreview = function () {
    var linkInput = document.querySelector('#metaSidebar [name="link"]');
    var typeInput = document.querySelector('#metaSidebar [name="type"]');
    if (linkInput && linkInput.value) {
      var section = (typeInput && typeInput.value === 'page') ? '/page/' : '/blog/';
      window.open(section + encodeURIComponent(linkInput.value), '_blank');
    } else {
      window.open('/dashboard', '_blank');
    }
  };

  /* ---- Link block ---- */
  function initLinkBlock(block) {
    var hidden = block.querySelector('[name="extra_data"]');
    var input = block.querySelector('.boat-rudder-entry-editor__link-url-input');
    if (input && hidden) input.value = hidden.value;
  }

  window.syncLinkUrl = function (input) {
    var block = input.closest('.boat-rudder-entry-editor-block');
    if (!block) return;
    var hidden = block.querySelector('[name="extra_data"]');
    if (hidden) hidden.value = input.value;
    setContentChanged();
  };

  /* ---- List block ---- */
  function initListBlock(block) {
    var hidden = block.querySelector('[name="extra_data"]');
    var sel = block.querySelector('.boat-rudder-entry-editor__list-type-select');
    if (sel && hidden) sel.value = hidden.value || 'ul';
  }

  window.setListType = function (sel) {
    var block = sel.closest('.boat-rudder-entry-editor-block');
    if (!block) return;
    var hidden = block.querySelector('[name="extra_data"]');
    if (hidden) hidden.value = sel.value;
    setContentChanged();
  };

  /* ---- YouTube block ---- */
  function initYouTubeBlock(block) {
    var hidden = block.querySelector('[name="extra_data"]');
    var input = block.querySelector('.boat-rudder-entry-editor__youtube-url-input');
    if (input && hidden) input.value = hidden.value;
    updateYouTubePreview(block);
  }

  window.syncYouTubeUrl = function (input) {
    var block = input.closest('.boat-rudder-entry-editor-block');
    if (!block) return;
    var hidden = block.querySelector('[name="extra_data"]');
    if (hidden) hidden.value = input.value;
    updateYouTubePreview(block);
    setContentChanged();
  };

  function youtubeToEmbed(url) {
    if (!url) return '';
    if (url.indexOf('youtube.com/embed/') !== -1) return url;
    var m = url.match(/[?&]v=([^&]{11})/);
    if (m) return 'https://www.youtube.com/embed/' + m[1];
    var m2 = url.match(/youtu\.be\/([^?]{11})/);
    if (m2) return 'https://www.youtube.com/embed/' + m2[1];
    return url;
  }

  function updateYouTubePreview(block) {
    var hidden = block.querySelector('[name="extra_data"]');
    var preview = block.querySelector('.boat-rudder-entry-editor__youtube-preview');
    if (!preview) return;
    var url = hidden ? hidden.value : '';
    if (!url) { preview.innerHTML = ''; return; }
    var embed = youtubeToEmbed(url);
    preview.innerHTML = '<iframe width="100%%" height="180" src="' + escapeHtml(embed) + '" frameborder="0" allowfullscreen></iframe>';
  }

  /* ---- Code-text and terminal blocks: the <select> holds extra_data (the
     language, or the shell) ---- */
  function initCodeBlock(block) {
    var hidden = block.querySelector('[name="extra_data"]');
    var sel = block.querySelector('.boat-rudder-entry-editor__code-lang-select');
    if (sel && hidden) sel.value = hidden.value || '';
  }

  window.syncCodeLang = function (sel) {
    var block = sel.closest('.boat-rudder-entry-editor-block');
    if (!block) return;
    var hidden = block.querySelector('[name="extra_data"]');
    if (hidden) hidden.value = sel.value;
    setContentChanged();
  };

  /* ---- Table block ----
     The raw textarea (rows on lines, cells separated by '|') stays the
     source of truth the server reads; a visual grid is built over it per
     language panel, mirroring the richtext swap-in above, and every edit
     to the grid is serialized straight back into that textarea. */
  function parseTableRows(text) {
    if (!text || !text.trim())
      return [['Column 1', 'Column 2', 'Column 3'], ['', '', ''], ['', '', '']];
    return text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n')
      .filter(function (r) { return r.length > 0; })
      .map(function (row) { return row.split('|'); });
  }

  function makeTableCell(value, isHeader, ta) {
    var cell = document.createElement('input');
    cell.type = 'text';
    cell.className = 'boat-rudder-entry-editor__table-cell' +
      (isHeader ? ' boat-rudder-entry-editor__table-cell--header' : '');
    cell.value = value || '';
    cell.addEventListener('click', function (e) { e.stopPropagation(); });
    cell.addEventListener('input', function () { syncTableEditor(ta); });
    return cell;
  }

  function buildTableGrid(editor, rows, hasHeader, ta) {
    editor.innerHTML = '';
    rows.forEach(function (cells, rowIdx) {
      var rowDiv = document.createElement('div');
      rowDiv.className = 'boat-rudder-entry-editor__table-row';
      cells.forEach(function (val) {
        rowDiv.appendChild(makeTableCell(val, hasHeader && rowIdx === 0, ta));
      });
      editor.appendChild(rowDiv);
    });
  }

  function tableHasHeader(block) {
    var hidden = block.querySelector('[name="extra_data"]');
    return !!hidden && hidden.value === 'header';
  }

  function syncTableEditor(ta) {
    var lc = ta.closest('.boat-rudder-entry-editor-block__lang-content');
    var editor = lc && lc.querySelector('.boat-rudder-entry-editor__table-editor');
    if (!editor) return;
    var rows = Array.from(editor.querySelectorAll('.boat-rudder-entry-editor__table-row')).map(function (row) {
      return Array.from(row.querySelectorAll('.boat-rudder-entry-editor__table-cell'))
        .map(function (c) { return c.value; }).join('|');
    });
    ta.value = rows.join('\n');
    onBlockInput(ta);
  }

  function initTableBlock(block) {
    var hidden = block.querySelector('[name="extra_data"]');
    var cb = block.querySelector('.boat-rudder-entry-editor__table-header-toggle');
    var hasHeader = hidden ? hidden.value === 'header' : false;
    if (cb) cb.checked = hasHeader;

    block.querySelectorAll('.boat-rudder-entry-editor-block__lang-content').forEach(function (lc) {
      var ta = lc.querySelector('[name="text"]');
      if (!ta || lc.querySelector('.boat-rudder-entry-editor__table-editor')) return;

      var toolbar = document.createElement('div');
      toolbar.className = 'boat-rudder-entry-editor-toolbar';
      toolbar.innerHTML =
        '<button type="button" class="boat-rudder-entry-editor-toolbar__btn boat-rudder-btn boat-rudder-btn--sm" title="Add row" onclick="event.stopPropagation();addTableRow(this)">+&#8594; Row</button>' +
        '<button type="button" class="boat-rudder-entry-editor-toolbar__btn boat-rudder-btn boat-rudder-btn--sm" title="Add column" onclick="event.stopPropagation();addTableCol(this)">+&#8595; Col</button>' +
        '<span class="boat-rudder-entry-editor-toolbar__sep"></span>' +
        '<button type="button" class="boat-rudder-entry-editor-toolbar__btn boat-rudder-btn boat-rudder-btn--sm" title="Delete last row" onclick="event.stopPropagation();delTableRow(this)">&#8722; Row</button>' +
        '<button type="button" class="boat-rudder-entry-editor-toolbar__btn boat-rudder-btn boat-rudder-btn--sm" title="Delete last column" onclick="event.stopPropagation();delTableCol(this)">&#8722; Col</button>';

      var editor = document.createElement('div');
      editor.className = 'boat-rudder-entry-editor__table-editor';

      lc.insertBefore(toolbar, ta);
      lc.insertBefore(editor, ta);
      ta.style.display = 'none';

      buildTableGrid(editor, parseTableRows(ta.value), hasHeader, ta);
      syncTableEditor(ta);
    });
  }

  window.setTableHeader = function (cb) {
    var block = cb.closest('.boat-rudder-entry-editor-block');
    if (!block) return;
    var hidden = block.querySelector('[name="extra_data"]');
    if (hidden) hidden.value = cb.checked ? 'header' : '';
    block.querySelectorAll('.boat-rudder-entry-editor-block__lang-content').forEach(function (lc) {
      var editor = lc.querySelector('.boat-rudder-entry-editor__table-editor');
      var firstRow = editor && editor.querySelector('.boat-rudder-entry-editor__table-row');
      if (!firstRow) return;
      firstRow.querySelectorAll('.boat-rudder-entry-editor__table-cell').forEach(function (c) {
        c.classList.toggle('boat-rudder-entry-editor__table-cell--header', cb.checked);
      });
    });
    refreshBlockPreview(block);
    setContentChanged();
  };

  window.addTableRow = function (btn) {
    var lc = btn.closest('.boat-rudder-entry-editor-block__lang-content');
    var editor = lc && lc.querySelector('.boat-rudder-entry-editor__table-editor');
    var ta = lc && lc.querySelector('[name="text"]');
    if (!editor || !ta) return;
    var firstRow = editor.querySelector('.boat-rudder-entry-editor__table-row');
    var colCount = firstRow ? firstRow.querySelectorAll('.boat-rudder-entry-editor__table-cell').length : 3;
    var rowDiv = document.createElement('div');
    rowDiv.className = 'boat-rudder-entry-editor__table-row';
    for (var i = 0; i < colCount; i++) rowDiv.appendChild(makeTableCell('', false, ta));
    editor.appendChild(rowDiv);
    syncTableEditor(ta);
  };

  // Epoch 0/1 render tables as fixed-width ASCII art sized for an 80-column
  // text terminal (see entry_page.c's render_table_ascii()); each column
  // costs at least 3 border/padding characters plus a 6-character content
  // floor once the row is too wide to fit and has to shrink, so a 9th
  // column can never fit even at that floor (1 + 9*3 + 9*6 = 82 > 80).
  // Capping the editor at 8 keeps every table on that renderer's readable
  // side instead of letting it degrade quietly at render time.
  var MAX_TABLE_COLS = 8;

  window.addTableCol = function (btn) {
    var lc = btn.closest('.boat-rudder-entry-editor-block__lang-content');
    var block = btn.closest('.boat-rudder-entry-editor-block');
    var editor = lc && lc.querySelector('.boat-rudder-entry-editor__table-editor');
    var ta = lc && lc.querySelector('[name="text"]');
    if (!editor || !ta) return;
    var firstRow = editor.querySelector('.boat-rudder-entry-editor__table-row');
    var colCount = firstRow ? firstRow.querySelectorAll('.boat-rudder-entry-editor__table-cell').length : 0;
    if (colCount >= MAX_TABLE_COLS) {
      alert('Tables are limited to ' + MAX_TABLE_COLS + ' columns, so they still fit an 80-column text browser.');
      return;
    }
    var hasHeader = tableHasHeader(block);
    editor.querySelectorAll('.boat-rudder-entry-editor__table-row').forEach(function (row, rowIdx) {
      row.appendChild(makeTableCell('', hasHeader && rowIdx === 0, ta));
    });
    syncTableEditor(ta);
  };

  window.delTableRow = function (btn) {
    var lc = btn.closest('.boat-rudder-entry-editor-block__lang-content');
    var editor = lc && lc.querySelector('.boat-rudder-entry-editor__table-editor');
    var ta = lc && lc.querySelector('[name="text"]');
    if (!editor || !ta) return;
    var rows = editor.querySelectorAll('.boat-rudder-entry-editor__table-row');
    if (rows.length > 1) { rows[rows.length - 1].remove(); syncTableEditor(ta); }
  };

  window.delTableCol = function (btn) {
    var lc = btn.closest('.boat-rudder-entry-editor-block__lang-content');
    var editor = lc && lc.querySelector('.boat-rudder-entry-editor__table-editor');
    var ta = lc && lc.querySelector('[name="text"]');
    if (!editor || !ta) return;
    var firstRow = editor.querySelector('.boat-rudder-entry-editor__table-row');
    if (!firstRow || firstRow.querySelectorAll('.boat-rudder-entry-editor__table-cell').length <= 1) return;
    editor.querySelectorAll('.boat-rudder-entry-editor__table-row').forEach(function (row) {
      var cells = row.querySelectorAll('.boat-rudder-entry-editor__table-cell');
      if (cells.length > 0) cells[cells.length - 1].remove();
    });
    syncTableEditor(ta);
  };

  /* ---- Social-networks block ---- */
  function initSocialBlock(block) {
    var hidden = block.querySelector('[name="extra_data"]');
    if (!hidden) return;
    var parts = hidden.value.split('|');
    var iconSel = block.querySelector('.boat-rudder-entry-editor__social-icon-select');
    var urlInput = block.querySelector('.boat-rudder-entry-editor__social-url-input');
    if (iconSel) iconSel.value = parts[0] || '';
    if (urlInput) urlInput.value = parts[1] || '';
  }

  function syncSocialExtraData(block) {
    var hidden = block.querySelector('[name="extra_data"]');
    var iconSel = block.querySelector('.boat-rudder-entry-editor__social-icon-select');
    var urlInput = block.querySelector('.boat-rudder-entry-editor__social-url-input');
    if (hidden) hidden.value = (iconSel ? iconSel.value : '') + '|' + (urlInput ? urlInput.value : '');
  }

  window.syncSocialIcon = function (sel) {
    var block = sel.closest('.boat-rudder-entry-editor-block');
    if (!block) return;
    var preview = block.querySelector('.boat-rudder-entry-editor__social-icon-preview');
    if (preview) preview.src = '/themes/dark/assets/social-networks/' + sel.value + '.svg';
    syncSocialExtraData(block);
    setContentChanged();
  };

  window.syncSocialUrl = function (input) {
    var block = input.closest('.boat-rudder-entry-editor-block');
    if (!block) return;
    syncSocialExtraData(block);
    setContentChanged();
  };

  /* ---- Image block ----
     Each language may have its own picture. English's is the default: a
     language whose path is empty shows English's, on the site too
     (cms_entries.c), so a picture is only stored where it differs. */
  var IMAGE_DEFAULT_LANG = langs.indexOf('en') >= 0 ? 'en' : langs[0];

  function imageField(block, lang) {
    var panel = block.querySelector('.boat-rudder-entry-editor-block__lang-content[data-lang="' + lang + '"]');
    return panel ? panel.querySelector('[name="text"]') : null;
  }

  function imageUrlFor(block, lang) {
    var own = imageField(block, lang), def = imageField(block, IMAGE_DEFAULT_LANG);
    return (own && own.value.trim()) || (def && def.value.trim()) || '';
  }

  // The media picker's choice, for the language being edited. Picked for
  // English, it is every language's that had none of its own - or had
  // English's previous one copied in, which is how blocks were stored before.
  window.setBlockImage = function (block, url) {
    var def = imageField(block, IMAGE_DEFAULT_LANG);
    if (!def) return;
    if (currentLang === IMAGE_DEFAULT_LANG) {
      var old = def.value.trim();
      def.value = url;
      langs.forEach(function (lang) {
        var f = imageField(block, lang);
        if (lang !== IMAGE_DEFAULT_LANG && f && (f.value.trim() === old || f.value.trim() === url)) f.value = '';
      });
    } else if (!def.value.trim()) {
      // The first picture, whatever tab it was picked on, is the default.
      def.value = url;
    } else {
      var own = imageField(block, currentLang);
      if (own) own.value = url === def.value.trim() ? '' : url;
    }
    renderImagePreview(block);
    refreshBlockPreview(block);
  };

  window.useDefaultImage = function (btn) {
    var block = btn.closest('.boat-rudder-entry-editor-block');
    var own = block ? imageField(block, currentLang) : null;
    if (!own) return;
    own.value = '';
    renderImagePreview(block);
    refreshBlockPreview(block);
    setContentChanged();
  };

  // Under the picture, on a language other than English: whose picture it is.
  function renderImageLangNote(block) {
    var note = block.querySelector('.boat-rudder-entry-editor__image-lang');
    if (!note) return;
    var own = imageField(block, currentLang);
    var def = imageField(block, IMAGE_DEFAULT_LANG);
    var hasOwn = currentLang !== IMAGE_DEFAULT_LANG && own && own.value.trim();
    note.hidden = currentLang === IMAGE_DEFAULT_LANG || !(def && def.value.trim()) && !hasOwn;
    note.querySelector('.boat-rudder-entry-editor__image-lang-text').textContent = hasOwn
      ? langName(currentLang) + ' has its own image.'
      : 'Using the ' + langName(IMAGE_DEFAULT_LANG) + ' image. Select photo to give ' +
        langName(currentLang) + ' its own.';
    var reset = note.querySelector('button');
    reset.hidden = !hasOwn;
    reset.textContent = 'Use the ' + langName(IMAGE_DEFAULT_LANG) + ' image';
  }

  // Opening a block hides its preview and shows the body, so the body needs its
  // own picture: otherwise editing an image would show only the path textareas.
  window.renderImagePreview = function (block) {
    var container = block.querySelector('.boat-rudder-entry-editor__image-preview');
    if (!container) return;
    renderImageLangNote(block);
    var url = imageUrlFor(block, currentLang);

    container.innerHTML = '';
    if (!url) {
      container.innerHTML = '<span class="boat-rudder-entry-editor__gallery-empty">No image selected</span>';
      return;
    }
    var img = document.createElement('img');
    // Paths are stored bare; only the generated variants exist on disk.
    img.src = url.replace(/(\.jpg|\.jpeg|\.gif|\.png)$/i, '_small$1');
    img.className = 'boat-rudder-entry-editor__image-thumb';
    img.alt = '';

    // Mirror the chosen size and alignment so the controls show their effect.
    var opts = (block.querySelector('[name="extra_data"]') || {}).value || '';
    var parts = opts.split('|');
    var width = ['100', '50', '30'].indexOf(parts[1]) >= 0 ? parts[1] : '100';
    var align = ['left', 'center', 'right', 'float-left', 'float-right'].indexOf(parts[2]) >= 0 ? parts[2] : 'center';
    img.style.width = width + '%%';
    container.style.justifyContent =
      /left$/.test(align) ? 'flex-start' : /right$/.test(align) ? 'flex-end' : 'center';

    container.appendChild(img);
  };

  // extra_data packs "caption|width|align"; the three controls read from and
  // write back to that single hidden field. A value with no '|' is all caption,
  // which is how blocks written before these options look.
  function initImageBlock(block) {
    var hidden = block.querySelector('[name="extra_data"]');
    var parts = hidden ? hidden.value.split('|') : [];
    var caption = block.querySelector('.boat-rudder-entry-editor__image-caption');
    var size = block.querySelector('.boat-rudder-entry-editor__image-size');
    var align = block.querySelector('.boat-rudder-entry-editor__image-align');
    if (caption) caption.value = parts[0] || '';
    if (size) size.value = ['100', '50', '30'].indexOf(parts[1]) >= 0 ? parts[1] : '100';
    if (align) align.value = ['left', 'center', 'right', 'float-left', 'float-right'].indexOf(parts[2]) >= 0 ? parts[2] : 'center';
    renderImagePreview(block);
  }

  window.syncImageOptions = function (el) {
    var block = el.closest('.boat-rudder-entry-editor-block');
    if (!block) return;
    var hidden = block.querySelector('[name="extra_data"]');
    var caption = block.querySelector('.boat-rudder-entry-editor__image-caption');
    var size = block.querySelector('.boat-rudder-entry-editor__image-size');
    var align = block.querySelector('.boat-rudder-entry-editor__image-align');
    if (hidden) {
      hidden.value = (caption ? caption.value : '') + '|' +
                     (size ? size.value : '100') + '|' +
                     (align ? align.value : 'center');
    }
    renderImagePreview(block);
    refreshBlockPreview(block);
    setContentChanged();
  };

  /* ---- Gallery block ----
     The body lists the photos as numbered tiles, in gallery order: drag a
     tile or use its arrows to move it, x removes it, and the last tile adds
     more from the media library - appended, never replacing. Every change
     rewrites the block's text fields ("url;url;...", the same value in every
     language) and refreshes the preview. */
  function initGalleryBlock(block) {
    var gp = block.querySelector('.boat-rudder-entry-editor__gallery-preview');
    if (!gp) return;
    var panel = block.querySelector('.boat-rudder-entry-editor-block__lang-content[data-lang="' + currentLang + '"]');
    var tf = panel ? panel.querySelector('[name="text"]') : null;
    renderGalleryThumbs(gp, tf ? tf.value : '');
  }

  function galleryUrls(value) {
    return (value || '').split(';')
      .map(function (u) { return u.trim(); })
      .filter(Boolean);
  }

  function galleryItems(container) {
    return Array.from(container.querySelectorAll('.boat-rudder-entry-editor-gallery__item'));
  }

  window.renderGalleryThumbs = function (container, value) {
    var urls = galleryUrls(value);
    var iconBtn = 'boat-rudder-btn boat-rudder-btn--ghost boat-rudder-btn--icon';
    container.innerHTML = '';
    urls.forEach(function (url, i) {
      var item = document.createElement('div');
      item.className = 'boat-rudder-entry-editor-gallery__item';
      item.draggable = true;
      item.dataset.url = url;
      item.innerHTML =
        '<img class="boat-rudder-entry-editor-gallery__thumb" alt="" src="' +
          escapeHtml(url.replace(/(\.jpg|\.jpeg|\.gif|\.png)$/i, '_small$1')) + '">' +
        '<span class="boat-rudder-entry-editor-gallery__index">' + (i + 1) + '</span>' +
        '<div class="boat-rudder-entry-editor-gallery__actions">' +
          '<button type="button" class="' + iconBtn + '" data-gallery-action="earlier" title="Move earlier"' +
            (i === 0 ? ' disabled' : '') + '>&#8592;</button>' +
          '<button type="button" class="' + iconBtn + '" data-gallery-action="later" title="Move later"' +
            (i === urls.length - 1 ? ' disabled' : '') + '>&#8594;</button>' +
          '<button type="button" class="' + iconBtn + ' boat-rudder-entry-editor-gallery__remove" data-gallery-action="remove"' +
            ' title="Remove from the gallery">&times;</button>' +
        '</div>';
      container.appendChild(item);
    });

    var add = document.createElement('button');
    add.type = 'button';
    add.className = 'boat-rudder-entry-editor-gallery__add boat-rudder-btn boat-rudder-btn--ghost';
    add.dataset.galleryAction = 'add';
    add.textContent = urls.length ? '+ Add photos' : '+ Select photos';
    container.appendChild(add);

    // Listeners live on the container, which outlives every re-render:
    // attached once, they never stack up.
    if (!container.dataset.galleryReady) {
      initGalleryTiles(container);
      container.dataset.galleryReady = '1';
    }
  };

  function initGalleryTiles(container) {
    container.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-gallery-action]');
      if (!btn || !container.contains(btn) || btn.disabled) return;
      e.stopPropagation();
      var action = btn.dataset.galleryAction;
      if (action === 'add') { openGalleryForBlock(btn); return; }

      var item = btn.closest('.boat-rudder-entry-editor-gallery__item');
      if (!item) return;
      if (action === 'remove') {
        item.remove();
      } else if (action === 'earlier' && item.previousElementSibling) {
        item.previousElementSibling.before(item);
      } else if (action === 'later') {
        var next = item.nextElementSibling;
        if (next && next.classList.contains('boat-rudder-entry-editor-gallery__item')) next.after(item);
      }
      syncGalleryInput(container);
    });

    var dragging = null;
    container.addEventListener('dragstart', function (e) {
      dragging = e.target.closest('.boat-rudder-entry-editor-gallery__item');
      if (!dragging) return;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', dragging.dataset.url);
      setTimeout(function () { if (dragging) dragging.classList.add('boat-rudder-entry-editor-gallery__item--dragging'); }, 0);
    });
    container.addEventListener('dragend', function () {
      if (dragging) dragging.classList.remove('boat-rudder-entry-editor-gallery__item--dragging');
      dragging = null;
      syncGalleryInput(container);
    });
    container.addEventListener('dragover', function (e) {
      if (!dragging) return;
      e.preventDefault();
      var target = e.target.closest('.boat-rudder-entry-editor-gallery__item');
      if (!target || target === dragging) return;
      var items = galleryItems(container);
      if (items.indexOf(dragging) < items.indexOf(target)) target.after(dragging);
      else target.before(dragging);
    });
    container.addEventListener('drop', function (e) {
      if (dragging) e.preventDefault();
    });
  }

  function syncGalleryInput(container) {
    var block = container.closest('.boat-rudder-entry-editor-block');
    if (!block) return;
    var joined = galleryItems(container)
      .map(function (item) { return item.dataset.url; })
      .filter(Boolean).join(';');
    block.querySelectorAll('.boat-rudder-entry-editor-block__lang-content [name="text"]').forEach(function (tf) {
      tf.value = joined;
    });
    renderGalleryThumbs(container, joined);   // renumber, re-enable the arrows
    refreshBlockPreview(block);
    setContentChanged();
  }

  window.openGalleryForBlock = function (btn) {
    var block = btn.closest('.boat-rudder-entry-editor-block');
    if (!block) return;
    window._galleryTargetBlock = block;
    window.contentEditorGalleryType = 'gallery-block';
    window.contentEditorGalleryId = block.dataset.blockId;
    window.galleryElementsToUpdate = [];
    loadMediaModal();
  };

  /* ---- Gallery modal ---- */
  function activateScripts(container) {
    container.querySelectorAll('script').forEach(function (old) {
      var s = document.createElement('script');
      s.textContent = old.textContent;
      old.parentNode.replaceChild(s, old);
    });
  }

  function loadMediaModal(callback) {
    fetch('/dashboard/api/media/modal')
      .then(function (r) { if (!r.ok) throw new Error('Failed'); return r.text(); })
      .then(function (html) {
        var container = document.getElementById('modalContainer');
        container.innerHTML = html;
        activateScripts(container);
        var modal = container.querySelector('.boat-rudder-modal');
        if (modal) modal.style.display = 'flex';
        if (callback) callback();
      })
      .catch(function (err) { console.error(err); });
  }

  window.openImageGallery = function (btn) {
    var block = btn.closest('.boat-rudder-entry-editor-block');
    if (!block) return;
    window._galleryTargetBlock = block;
    window.contentEditorGalleryType = 'image-block';
    window.contentEditorGalleryId = block.dataset.blockId;
    window.galleryElementsToUpdate = [];
    loadMediaModal();
  };

  window.openGallery = function (elements, id, type) {
    window.galleryElementsToUpdate = elements;
    window.contentEditorGalleryType = type;
    window.contentEditorGalleryId = id;
    loadMediaModal();
  };

  /* ---- Header image preview ---- */
  function updateHeaderImagePreview() {
    var input = document.querySelector('#headerSidebar [name="image_url"]');
    var preview = document.getElementById('header-img-preview');
    if (!input || !preview) return;
    var url = input.value.trim();
    if (url) {
      var thumb = url.replace(/(\.jpg|\.jpeg|\.gif|\.png)$/i, '_small$1');
      preview.innerHTML = '<img src="' + thumb + '" alt="Cover">';
    } else {
      preview.innerHTML = '<span class="boat-rudder-entry-editor-img-preview__placeholder">No image</span>';
    }
  }


  /* ---- Initialize ---- */
  function init() {
    initPublishToggle();
    document.querySelectorAll('#entryBlocks > .boat-rudder-entry-editor-block').forEach(initInlineBlock);
    var settingsOpen = null;
    try { settingsOpen = localStorage.getItem('br-editor-settings-open'); } catch (e) {}
    // First visit: open beside the sheet on a wide screen, folded on a small one.
    toggleEditorSettings(settingsOpen === null ? window.matchMedia('(min-width: 1200px)').matches : settingsOpen === '1');
    setLang(currentLang);
    refreshAllPreviews();
    setupDragHandles();
    updateHeaderImagePreview();
    updateContextBar();

    var imgInput = document.querySelector('#headerSidebar [name="image_url"]');
    if (imgInput) imgInput.addEventListener('input', updateHeaderImagePreview);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
