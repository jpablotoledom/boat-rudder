<article class="boat-rudder-entry-editor" id="entryEditor" data-entry-id="%s" data-langs='%s'%s>

  <!-- Fixed top bar -->
  <div class="boat-rudder-entry-editor__topbar">
    <div class="boat-rudder-entry-editor__topbar-left">
      <a href="/dashboard" class="boat-rudder-entry-editor__back boat-rudder-btn boat-rudder-btn--ghost boat-rudder-btn--sm">&#8592; Dashboard</a>
      <button class="boat-rudder-entry-editor__preview-btn boat-rudder-btn boat-rudder-btn--sm" onclick="openBlogPreview()">&#128065; View post</button>
    </div>
    <div class="boat-rudder-entry-editor__topbar-center">
      <button class="boat-rudder-entry-editor__save-btn boat-rudder-btn boat-rudder-btn--primary" id="editor-save-btn" onclick="editorSaveAll()">Save all</button>
      <span class="boat-rudder-entry-editor__save-status" id="editor-save-status"></span>
      <div class="boat-rudder-entry-editor-autosave-toggle" onclick="toggleAutoSave()" title="Toggle auto-save">
        <span class="boat-rudder-entry-editor-autosave-toggle__label" id="autosave-label">Manual</span>
        <div class="boat-rudder-switch" id="autosave-switch">
          <div class="boat-rudder-switch__knob"></div>
        </div>
      </div>
    </div>
    <div class="boat-rudder-entry-editor__topbar-right">
      <div class="boat-rudder-entry-editor-translate" id="translateBox" hidden>
        <button class="boat-rudder-btn boat-rudder-btn--sm" type="button" onclick="toggleTranslatePanel()">&#127760; Translate</button>
        <div class="boat-rudder-entry-editor-translate__panel" id="translatePanel">
          <p class="boat-rudder-entry-editor-translate__from">From <strong id="translateFrom"></strong> to:</p>
          <div id="translateTargets"></div>
          <label class="boat-rudder-entry-editor-translate__target boat-rudder-entry-editor-translate__overwrite"><input type="checkbox" id="translateOverwrite" onchange="updateTranslateHint()"> Replace what is already written</label>
          <p class="boat-rudder-entry-editor-translate__hint" id="translateHint"></p>
          <p class="boat-rudder-entry-editor-translate__message" id="translateMessage" role="status"></p>
          <button class="boat-rudder-btn boat-rudder-btn--primary boat-rudder-btn--sm" type="button" onclick="runTranslation()">Translate</button>
        </div>
      </div>
      <div class="boat-rudder-entry-editor-publish-toggle" onclick="togglePublish()">
        <span class="boat-rudder-entry-editor-publish-toggle__status" id="publish-status-label">Draft</span>
        <div class="boat-rudder-switch" id="publish-switch">
          <div class="boat-rudder-switch__knob"></div>
        </div>
      </div>
      <div class="boat-rudder-entry-editor__lang-toggle">
%s
      </div>
      <button class="boat-rudder-btn boat-rudder-btn--sm boat-rudder-entry-editor__settings-btn" id="editorSettingsBtn" type="button" onclick="toggleEditorSettings()" aria-expanded="false" title="Entry settings: slug, type, categories, cover, title, summary">&#9881;<span class="boat-rudder-entry-editor-context__label"> Settings</span></button>
    </div>
  </div>

  <!-- Context bar: one place for the tools of whichever block is being
       edited. A block's own tool row (.boat-rudder-entry-editor-block__tools)
       stays in the block - so its handlers still find it with closest() -
       and is pinned over #editorContextTools while the block is open
       (placeContextTools()). -->
  <div class="boat-rudder-entry-editor-context" id="editorContext">
    <div class="boat-rudder-entry-editor-add-block boat-rudder-entry-editor-context__insert">
      <button class="boat-rudder-btn boat-rudder-btn--primary boat-rudder-btn--sm" type="button" onclick="toggleAddBlockDropdown(this)" title="Insert a block after the one being edited">+ Insert</button>
    </div>
    <span class="boat-rudder-entry-editor-context__type" id="editorContextType"></span>
    <!-- Paragraphs, headings and lists turn into one another, text kept. -->
    <select class="boat-rudder-entry-editor-context__switch" id="editorContextSwitch" onchange="switchActiveBlockType(this)" title="Change this block's type" hidden>
      <option value="paragraph">&para; Paragraph</option>
      <option value="title:1">Heading 1</option>
      <option value="title:2">Heading 2</option>
      <option value="title:3">Heading 3</option>
      <option value="title:4">Heading 4</option>
      <option value="title:5">Heading 5</option>
      <option value="title:6">Heading 6</option>
      <option value="list:ul">&bull; Bulleted list</option>
      <option value="list:ol">1. Numbered list</option>
    </select>
    <div class="boat-rudder-entry-editor-context__tools" id="editorContextTools"></div>
    <div class="boat-rudder-entry-editor-context__actions" id="editorContextActions" hidden>
      <button class="boat-rudder-btn boat-rudder-btn--ghost boat-rudder-btn--sm" type="button" data-para-only onmousedown="event.preventDefault()" onclick="contextAction('split')"
              title="Split: move everything after the cursor into a new paragraph below">&#9986;<span class="boat-rudder-entry-editor-context__label"> Split</span></button>
      <button class="boat-rudder-btn boat-rudder-btn--ghost boat-rudder-btn--sm" type="button" data-para-only id="editorContextMerge" onclick="contextAction('merge')"
              title="Merge: join this paragraph onto the end of the one above">&#8613;<span class="boat-rudder-entry-editor-context__label"> Merge</span></button>
      <span class="boat-rudder-entry-editor-toolbar__sep" data-para-only></span>
      <button class="boat-rudder-btn boat-rudder-btn--ghost boat-rudder-btn--sm" type="button" onclick="contextAction('up')" title="Move up">&#8679;</button>
      <button class="boat-rudder-btn boat-rudder-btn--ghost boat-rudder-btn--sm" type="button" onclick="contextAction('down')" title="Move down">&#8681;</button>
      <button class="boat-rudder-btn boat-rudder-btn--ghost boat-rudder-btn--sm" type="button" onclick="contextAction('advanced')" title="Advanced (extra_data)">&#9881;</button>
      <button class="boat-rudder-btn boat-rudder-btn--ghost boat-rudder-btn--sm boat-rudder-entry-editor-context__delete" type="button" onclick="contextAction('delete')" title="Delete block">&#128465;</button>
    </div>
  </div>

  <!-- Shown once the session has ended (sessionLost()): nothing can be saved
       until the writer signs in again, and the unsaved work stays here. -->
  <div class="boat-rudder-entry-editor-session" id="editorSession" role="alert" hidden>
    <div class="boat-rudder-entry-editor-session__text">
      <strong>Your session has ended, so your changes can't be saved.</strong>
      They are still on this page - don't reload or close it. Sign in again in a new tab, then save.
    </div>
    <a class="boat-rudder-btn boat-rudder-btn--sm" href="/login" target="_blank" rel="noopener">Sign in in a new tab</a>
    <button class="boat-rudder-btn boat-rudder-btn--primary boat-rudder-btn--sm" type="button" onclick="retryAfterSignIn()">Save again</button>
    <span class="boat-rudder-entry-editor-session__note" id="editorSessionNote" role="status"></span>
  </div>

  <!-- Body: the sheet, and the settings panel the top bar's Settings opens -->
  <div class="boat-rudder-entry-editor__body">
    <div class="boat-rudder-entry-editor__settings-backdrop" onclick="toggleEditorSettings(false)"></div>
    <div class="boat-rudder-entry-editor__sidebar" id="editorSettings">
      <div class="boat-rudder-entry-editor__sidebar-inner">
%s
        <hr class="boat-rudder-entry-editor__sidebar-divider">
%s
      </div>
    </div>
    <!-- The sheet: the content blocks -->
    <div class="boat-rudder-entry-editor__main">
%s
    </div>
  </div>
</article>
<div id="modalContainer"></div>

<script>
(function () {
  var root = document.getElementById('entryEditor');
  var entryId = root.dataset.entryId;
  var langs = JSON.parse(root.dataset.langs);
  var currentLang = langs[0];
  var autoSaveTimer = null;
  var autoSaveEnabled = false;
  var dirty = false;
  var activeEditBlock = null;

  document.body.classList.add('boat-rudder-entry-editor-mode');

  function apiUrl(suffix) {
    return '/dashboard/api/entries/' + entryId + suffix;
  }

  // Every editor write. Resolves with the server's JSON ({ok, ...}); rejects
  // when there is none to read - no session (401, err.session "expired"), a
  // token from an older session (err.session "csrf"), an answer that isn't
  // JSON, no answer at all - so a save can never hang on "Saving...".
  function postForm(url, params) {
    return fetch(url, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: params.toString()
    }).then(function (res) {
      return res.json().catch(function () { return null; }).then(function (data) {
        if (res.status === 401 || (data && data.session === 'expired')) throw sessionError('expired');
        if (data && data.session === 'csrf') throw sessionError('csrf');
        if (!data) throw new Error('the server answered ' + res.status);
        return data;
      });
    }).catch(function (err) {
      if (err.session === 'expired') sessionLost();
      throw err;
    });
  }

  /* ---- Session ----
     A session ends on its own (session_ttl_seconds), or in another tab. The
     editor checks it every few minutes and whenever its tab comes back, so
     the writer hears of it before saving, not after; then it keeps the work
     on the page, and once they sign in again (in a new tab) it fetches the
     new session's CSRF token and saves. */
  var SESSION_CHECK_MS = 5 * 60 * 1000;

  function sessionError(kind) {
    var err = new Error(kind === 'csrf' ? 'signed in again since the page loaded' : 'session expired');
    err.session = kind;
    return err;
  }

  function sessionLost() {
    document.getElementById('editorSession').hidden = false;
    setStatus('Signed out - not saved', 'error');
  }

  // true: signed in (and the page now holds this session's token); false:
  // signed out; null: no answer (offline, server down) - nothing known.
  function checkSession() {
    return fetch('/dashboard/api/session', { credentials: 'same-origin', cache: 'no-store' })
      .then(function (res) {
        return res.json().catch(function () { return null; }).then(function (data) {
          if (res.ok && data && data.ok) {
            if (window.boatRudderSetCsrfToken) window.boatRudderSetCsrfToken(data.csrf);
            return true;
          }
          if (res.status === 401 || (data && data.ok === false)) { sessionLost(); return false; }
          return null;
        });
      }, function () { return null; });
  }

  window.retryAfterSignIn = function () {
    var note = document.getElementById('editorSessionNote');
    note.textContent = 'Checking...';
    checkSession().then(function (ok) {
      if (ok) {
        note.textContent = '';
        document.getElementById('editorSession').hidden = true;
        editorSaveAll();
      } else {
        note.textContent = ok === false ? 'Still signed out: sign in in the other tab first.'
                                        : 'The server did not answer. Try again in a moment.';
      }
    });
  };

  setInterval(checkSession, SESSION_CHECK_MS);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') checkSession();
  });

  // Leaving with unsaved changes (reload, close, "Dashboard") asks first.
  window.addEventListener('beforeunload', function (e) {
    if (!dirty) return;
    e.preventDefault();
    e.returnValue = '';
  });

  function setStatus(text, cls) {
    var el = document.getElementById('editor-save-status');
    el.textContent = text;
    el.className = 'boat-rudder-entry-editor__save-status' +
      (cls ? ' boat-rudder-entry-editor__save-status--' + cls : '');
  }

  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /* ---- Publish toggle ---- */
  function initPublishToggle() {
    var cb = document.querySelector('#metaSidebar [name="enabled"]');
    if (!cb) return;
    var sw = document.getElementById('publish-switch');
    var label = document.getElementById('publish-status-label');
    if (cb.checked) {
      sw.classList.add('boat-rudder-switch--on');
      label.textContent = 'Published';
      label.classList.add('boat-rudder-entry-editor-publish-toggle__status--published');
    } else {
      sw.classList.remove('boat-rudder-switch--on');
      label.textContent = 'Draft';
      label.classList.remove('boat-rudder-entry-editor-publish-toggle__status--published');
    }
  }

  window.togglePublish = function () {
    var cb = document.querySelector('#metaSidebar [name="enabled"]');
    if (!cb) return;
    cb.checked = !cb.checked;
    initPublishToggle();
    setContentChanged();
  };

  /* ---- Autosave toggle ---- */
  window.toggleAutoSave = function () {
    autoSaveEnabled = !autoSaveEnabled;
    var sw = document.getElementById('autosave-switch');
    var label = document.getElementById('autosave-label');
    if (autoSaveEnabled) {
      sw.classList.add('boat-rudder-switch--on');
      label.textContent = 'Auto';
      label.classList.add('boat-rudder-entry-editor-autosave-toggle__label--on');
    } else {
      sw.classList.remove('boat-rudder-switch--on');
      label.textContent = 'Manual';
      label.classList.remove('boat-rudder-entry-editor-autosave-toggle__label--on');
    }
    if (autoSaveEnabled && dirty) editorScheduleAutoSave();
  };

  /* ---- Language switching ---- */
  function applyLangVisibility(scopeEl) {
    var panels = scopeEl.querySelectorAll('.boat-rudder-entry-editor-block__lang-content');
    for (var i = 0; i < panels.length; i++) {
      panels[i].classList.toggle('boat-rudder-entry-editor-block__lang-content--active', panels[i].dataset.lang === currentLang);
    }
  }

  window.setLang = function (code) {
    currentLang = code;
    var tabs = root.querySelectorAll('.boat-rudder-entry-editor__lang-btn');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].classList.toggle('boat-rudder-btn--active', tabs[i].dataset.lang === code);
    }
    applyLangVisibility(document);
    refreshAllPreviews();
    // An open image block shows its own picture, which may change with the language.
    if (activeEditBlock && activeEditBlock.dataset.type === 'image') renderImagePreview(activeEditBlock);
    document.querySelectorAll('#entryBlocks [data-type="title"]').forEach(autosizeTitle);
  };

  /* ---- Block preview/edit ---- */
  window.activateBlock = function (el) {
    if (!el) return;
    var block = el.closest ? el.closest('.boat-rudder-entry-editor-block') : el;
    if (!block || block.classList.contains('boat-rudder-entry-editor-block--editing')) return;
    if (activeEditBlock && activeEditBlock !== block) {
      deactivateBlock(activeEditBlock);
    }
    block.classList.add('boat-rudder-entry-editor-block--editing');
    activeEditBlock = block;
    initBlockEditors(block);
    updateContextBar();
  };

  window.deactivateBlock = function (el) {
    if (!el) return;
    var block = el.closest ? el.closest('.boat-rudder-entry-editor-block') : el;
    if (!block) return;
    block.classList.remove('boat-rudder-entry-editor-block--editing');
    if (activeEditBlock === block) activeEditBlock = null;
    refreshBlockPreview(block);
    updateContextBar();
  };

  /* ---- Context bar ---- */
  // Paragraphs and titles are written straight on the sheet: always in edit
  // form, with no preview of their own (see initInlineBlock()).
  function isInlineType(type) {
    return type === 'paragraph' || type === 'title';
  }

  // The open block's name, tools and actions in the context bar - or only
  // "+ Insert" while none is open.
  function updateContextBar() {
    var block = activeEditBlock;
    var typeEl = document.getElementById('editorContextType');
    var actions = document.getElementById('editorContextActions');
    var label = block && block.querySelector('.boat-rudder-entry-editor-block__type-label');
    var sw = document.getElementById('editorContextSwitch');
    var switchable = !!block && /^(paragraph|title|list)$/.test(block.dataset.type);
    sw.hidden = !switchable;
    if (switchable) sw.value = blockVariantValue(block);
    typeEl.innerHTML = label && !switchable ? label.innerHTML : '';
    actions.hidden = !block;
    var isPara = !!block && block.dataset.type === 'paragraph';
    actions.querySelectorAll('[data-para-only]').forEach(function (b) { b.hidden = !isPara; });
    if (isPara) {
      var prev = block.previousElementSibling;
      document.getElementById('editorContextMerge').disabled = !(prev && prev.dataset.type === 'paragraph');
    }
    placeContextTools();
  }

  // A block's tool row is position: fixed over #editorContextTools; it gets
  // that slot's box here, measured again whenever the bar's layout changes.
  function placeContextTools() {
    var slot = document.getElementById('editorContextTools').getBoundingClientRect();
    root.style.setProperty('--br-editor-tools-left', slot.left + 'px');
    root.style.setProperty('--br-editor-tools-width', Math.max(slot.width, 0) + 'px');
  }
  window.addEventListener('resize', placeContextTools);

  window.contextAction = function (action) {
    var block = activeEditBlock;
    if (!block) return;
    if (action === 'split') splitParagraph(block);
    else if (action === 'merge') mergeParagraphUp(block);
    else if (action === 'up') { moveBlockUp(block); block.scrollIntoView({ block: 'nearest' }); updateContextBar(); }
    else if (action === 'down') { moveBlockDown(block); block.scrollIntoView({ block: 'nearest' }); updateContextBar(); }
    else if (action === 'delete') removeComponent(block);
    else if (action === 'advanced') {
      var toggle = block.querySelector('.boat-rudder-entry-editor-advanced__toggle');
      if (toggle) { toggleAdvanced(toggle); toggle.parentNode.scrollIntoView({ block: 'nearest' }); }
    }
  };

  /* ---- Settings panel ---- */
  // Slug, type, categories and the post header, folded away from the sheet.
  // Remembered per browser; storage may be unavailable (private mode).
  window.toggleEditorSettings = function (open) {
    if (typeof open !== 'boolean') open = !root.classList.contains('boat-rudder-entry-editor--settings-open');
    root.classList.toggle('boat-rudder-entry-editor--settings-open', open);
    document.getElementById('editorSettingsBtn').setAttribute('aria-expanded', String(open));
    try { localStorage.setItem('br-editor-settings-open', open ? '1' : '0'); } catch (e) {}
    placeContextTools();
  };

  // Escape, or a click anywhere outside the block being edited, closes it -
  // except while the media picker or the image lightbox is open on top,
  // which handle their own Escape and whose clicks belong to them.
  function overlayOpen() {
    var media = document.querySelector('#modalContainer .boat-rudder-modal');
    if (media && getComputedStyle(media).display !== 'none') return true;
    var lightbox = document.getElementById('imageModal');
    return !!(lightbox && lightbox.classList.contains('boat-rudder-modal--active'));
  }

  function closeAddBlockMenu() {
    var menu = document.getElementById('addBlockMenu');
    if (!menu || !menu.classList.contains('boat-rudder-entry-editor-add-block__dropdown--open')) return false;
    menu.classList.remove('boat-rudder-entry-editor-add-block__dropdown--open');
    return true;
  }

  // Escape closes the topmost thing first: an open "+ Add block" menu, and
  // only on a second press the block being edited.
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || overlayOpen()) return;
    if (closeAddBlockMenu() || closeTranslatePanel()) return;
    if (root.classList.contains('boat-rudder-entry-editor--settings-open') &&
        window.matchMedia('(max-width: 899px)').matches) { toggleEditorSettings(false); return; }
    if (activeEditBlock) {
      var focused = document.activeElement;
      if (focused && activeEditBlock.contains(focused)) focused.blur();
      deactivateBlock(activeEditBlock);
    }
  });

  // Judged by where the press started, not where the click lands: a text
  // selection dragged out of the block still started inside it. Bubble
  // phase, so a click on another block has already switched to that one,
  // and a toolbar button's insertNewComponent() has already captured the
  // open block as its insertion anchor before this closes it.
  var pressTarget = null;
  document.addEventListener('mousedown', function (e) { pressTarget = e.target; }, true);
  document.addEventListener('click', function (e) {
    var t = pressTarget || e.target;
    pressTarget = null;
    if (document.contains(t) && !t.closest('.boat-rudder-entry-editor-add-block')) closeAddBlockMenu();
    if (document.contains(t) && !t.closest('.boat-rudder-entry-editor-translate')) closeTranslatePanel();
    if (!activeEditBlock || overlayOpen()) return;
    if (!document.contains(t)) return; // removed by its own handler (a deleted table row...)
    if (activeEditBlock.contains(t) || t.closest('#modalContainer, #imageModal')) return;
    // "+ Add block" keeps the open block: the new one is inserted right after
    // it (insertNewComponent() anchors on activeEditBlock), and closing it
    // here would also shrink the layout under the menu as it opens.
    if (t.closest('.boat-rudder-entry-editor-add-block')) return;
    // The top bar's controls act on the whole entry (language, save,
    // publish...): switching language or saving mid-edit keeps the block open.
    if (t.closest('.boat-rudder-entry-editor__topbar')) return;
    // The context bar's tools and actions work on the open block.
    if (t.closest('.boat-rudder-entry-editor-context')) return;
    deactivateBlock(activeEditBlock);
  });

  // Tabbing (or clicking) into a paragraph or title opens it like a click on
  // its block does.
  document.getElementById('entryBlocks').addEventListener('focusin', function (e) {
    var block = e.target.closest('.boat-rudder-entry-editor-block');
    if (block && block !== activeEditBlock) activateBlock(block);
  });

  function initBlockEditors(block) {
    var type = block.dataset.type;
    if (type === 'paragraph') { initParagraphEditors(block); updateMergeButton(block); }
    if (type === 'title') initBlockHeadingBtns(block);
    if (type === 'gallery') initGalleryBlock(block);
    if (type === 'image') initImageBlock(block);
    if (type === 'link') initLinkBlock(block);
    if (type === 'list') initListBlock(block);
    if (type === 'youtube-embed') initYouTubeBlock(block);
    if (type === 'code-text' || type === 'terminal') initCodeBlock(block);
    if (type === 'table') initTableBlock(block);
    if (type === 'social-networks') initSocialBlock(block);
    applyLangVisibility(block);
  }

  /* ---- Block preview rendering ---- */

  // Block types whose public rendering is made server-side (code-text's
  // highlighting, terminal's prompts, gallery's thumbnails/tiles, table's rows, image's size/align
  // classes, paragraph's style variant) get previewed with that exact
  // epoch 3 output from /dashboard/api/block-preview, so the editor can't
  // drift from what readers see. `fallbackHtml` only fills the gap before the
  // first response (or if it fails); a per-block token drops a slower, older
  // response that lands after a newer one.
  //
  // An unchanged block keeps its current preview: the editor refreshes every
  // preview often (language switch, closing a block), and replacing the
  // markup would reload a YouTube iframe or every gallery image each time.
  function fetchServerPreview(blockEl, preview, type, text, extra, fallbackHtml, done) {
    var key = type + '\u0000' + text + '\u0000' + extra;
    // The node check catches another branch having replaced the preview
    // since (e.g. "Empty table"), which makes the cached key stale.
    if (blockEl._previewKey === key && blockEl._previewNode &&
        blockEl._previewNode.parentNode === preview) return;
    if (!preview.innerHTML) preview.innerHTML = fallbackHtml;
    var token = (blockEl._previewToken || 0) + 1;
    blockEl._previewToken = token;
    var params = new URLSearchParams();
    params.set('type', type);
    params.set('text', text);
    params.set('extra', extra);
    fetch('/dashboard/api/block-preview', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: params.toString()
    })
      .then(function (r) { if (!r.ok) throw new Error('Failed'); return r.text(); })
      .then(function (html) {
        if (blockEl._previewToken !== token) return;
        preview.innerHTML = html;
        blockEl._previewKey = key;
        blockEl._previewNode = preview.firstElementChild;
        if (done) done();
      })
      .catch(function () { if (blockEl._previewToken === token) preview.innerHTML = fallbackHtml; });
  }

  window.refreshBlockPreview = function (blockEl) {
    if (!blockEl) return;
    var type = blockEl.dataset.type;
    if (isInlineType(type)) { autosizeTitle(blockEl); return; }
    var preview = blockEl.querySelector('.boat-rudder-entry-editor-block__preview');
    if (!preview) return;

    var panel = blockEl.querySelector('.boat-rudder-entry-editor-block__lang-content[data-lang="' + currentLang + '"]');
    var textField = panel ? (panel.querySelector('.boat-rudder-entry-editor__richtext') || panel.querySelector('[name="text"]')) : null;
    var text = '';
    if (textField) {
      text = textField.classList && textField.classList.contains('boat-rudder-entry-editor__richtext')
        ? textField.innerHTML
        : textField.value;
    }
    var extraField = blockEl.querySelector('[name="extra_data"]');
    var extra = extraField ? extraField.value : '';

    if (type === 'title') {
      var level = parseInt(extra) || 2;
      preview.innerHTML = text.trim()
        ? '<h' + level + ' class="boat-rudder-entry-editor-preview__title">' + escapeHtml(text) + '</h' + level + '>'
        : '<span class="boat-rudder-empty">Empty title</span>';
    } else if (type === 'paragraph') {
      if (text) {
        fetchServerPreview(blockEl, preview, 'paragraph', text, extra,
          '<div class="boat-rudder-entry-editor-preview__paragraph">' + text + '</div>');
      } else {
        preview.innerHTML = '<div class="boat-rudder-entry-editor-preview__paragraph"><span class="boat-rudder-empty">Empty paragraph</span></div>';
      }
    } else if (type === 'image') {
      text = imageUrlFor(blockEl, currentLang);
      if (text) {
        // The stored path has no size suffix; only the generated variants exist
        // on disk, so the fallback asks for the thumbnail like galleries do.
        var imgThumb = text.trim().replace(/(\.jpg|\.jpeg|\.gif|\.png)$/i, '_small$1');
        // extra_data is "caption|width|align": only the first field is text.
        var imgCaption = extra.split('|')[0];
        fetchServerPreview(blockEl, preview, 'image', text, extra,
          '<figure class="boat-rudder-entry-editor-preview__image"><img src="' + escapeHtml(imgThumb) + '" alt="' + escapeHtml(imgCaption) + '"><figcaption>' + escapeHtml(imgCaption) + '</figcaption></figure>');
      } else {
        preview.innerHTML = '<span class="boat-rudder-empty">No image URL</span>';
      }
    } else if (type === 'byline') {
      preview.innerHTML = (text.trim() || extra.trim())
        ? '<div class="boat-rudder-entry-editor-preview__byline"><span class="boat-rudder-entry-editor-preview__byline-author">' + escapeHtml(text) + '</span><span class="boat-rudder-entry-editor-preview__byline-date">' + escapeHtml(extra) + '</span></div>'
        : '<span class="boat-rudder-empty">Empty byline</span>';
    } else if (type === 'gallery') {
      if (text && text.split(';').some(function (u) { return u.trim(); })) {
        var urls = text.split(';').filter(function (u) { return u.trim(); });
        var thumbs = urls.map(function (u) {
          var t = u.trim().replace(/(\.jpg|\.jpeg|\.gif|\.png)$/i, '_small$1');
          return '<img class="boat-rudder-entry-editor-preview__thumb" src="' + escapeHtml(t) + '" alt="">';
        }).join('');
        // buildGalleries (lightbox_epoch3.html) folds a gallery behind its
        // "+N" tile; it only runs on page load, so rerun it for the new one.
        fetchServerPreview(blockEl, preview, 'gallery', text, extra, thumbs, function () {
          if (window.buildGalleries) window.buildGalleries();
        });
      } else {
        preview.innerHTML = '<span class="boat-rudder-empty">Empty gallery</span>';
      }
    } else if (type === 'separator') {
      preview.innerHTML = '<hr style="border:none;border-top:2px solid #555;margin:8px 0;">';
    } else if (type === 'link') {
      preview.innerHTML = extra
        ? '<a href="#" class="boat-rudder-entry-editor-preview__link">' + escapeHtml(text || extra) + '</a>'
        : '<span class="boat-rudder-empty">No URL</span>';
    } else if (type === 'list') {
      if (text) {
        var items = text.split('\n').filter(function (l) { return l.trim(); });
        var tag = extra === 'ol' ? 'ol' : 'ul';
        preview.innerHTML = '<' + tag + ' class="boat-rudder-entry-editor-preview__list">' +
          items.map(function (l) { return '<li>' + escapeHtml(l.trim()) + '</li>'; }).join('') +
          '</' + tag + '>';
      } else {
        preview.innerHTML = '<span class="boat-rudder-empty">Empty list</span>';
      }
    } else if (type === 'youtube-embed') {
      if (extra) {
        fetchServerPreview(blockEl, preview, 'youtube-embed', text, extra,
          '<div class="boat-rudder-entry-editor-preview__youtube">&#9654; ' + escapeHtml(extra) + '</div>');
      } else {
        preview.innerHTML = '<span class="boat-rudder-empty">No YouTube URL</span>';
      }
    } else if (type === 'code-text') {
      if (text) {
        fetchServerPreview(blockEl, preview, 'code-text', text, extra,
          '<pre class="boat-rudder-entry-editor-preview__code"><code>' + escapeHtml(text) + '</code></pre>');
      } else {
        preview.innerHTML = '<span class="boat-rudder-empty">Empty code block</span>';
      }
    } else if (type === 'terminal') {
      if (text) {
        fetchServerPreview(blockEl, preview, 'terminal', text, extra,
          '<pre class="boat-rudder-entry-editor-preview__code"><code>' + escapeHtml(text) + '</code></pre>');
      } else {
        preview.innerHTML = '<span class="boat-rudder-empty">Empty terminal block</span>';
      }
    } else if (type === 'generic') {
      if (text) {
        preview.innerHTML = '<div class="boat-rudder-entry-editor-preview__generic">' + text.substring(0, 300) + '</div>';
      } else {
        preview.innerHTML = '<span class="boat-rudder-empty">Empty HTML block</span>';
      }
    } else if (type === 'table') {
      if (text) {
        var tRows = text.split('\n').filter(function (l) { return l.trim(); }).map(function (l) { return l.split('|'); });
        var tHasHeader = extra === 'header';
        var tHtml = '<table class="boat-rudder-entry-editor-preview__table">' +
          tRows.map(function (cells, rowIdx) {
            var tag = tHasHeader && rowIdx === 0 ? 'th' : 'td';
            return '<tr>' + cells.map(function (c) { return '<' + tag + '>' + escapeHtml(c) + '</' + tag + '>'; }).join('') + '</tr>';
          }).join('') +
          '</table>';
        fetchServerPreview(blockEl, preview, 'table', text, extra, tHtml);
      } else {
        preview.innerHTML = '<span class="boat-rudder-empty">Empty table</span>';
      }
    } else if (type === 'social-networks') {
      if (extra) {
        var parts = extra.split('|');
        preview.innerHTML = '<div class="boat-rudder-entry-editor-preview__social">' + escapeHtml(parts[0]) + (parts[1] ? ': ' + escapeHtml(parts[1]) : '') + '</div>';
      } else {
        preview.innerHTML = '<span class="boat-rudder-empty">No social link</span>';
      }
    } else {
      preview.innerHTML = '<span class="boat-rudder-empty">[' + escapeHtml(type) + ']</span>';
    }
  };

  function refreshAllPreviews() {
    var blocks = document.querySelectorAll('.boat-rudder-entry-editor-block');
    for (var i = 0; i < blocks.length; i++) {
      if (!blocks[i].classList.contains('boat-rudder-entry-editor-block--editing')) refreshBlockPreview(blocks[i]);
    }
  }

  // Image and gallery previews are their published markup, whose pictures
  // (and a gallery's "+N" tile) open the lightbox - but in the editor a click
  // there should select the block, and the pictures are most of what there
  // is to click (a floated image leaves its block with almost no height of
  // its own). Capture phase, so it runs before their own handlers and can
  // stop them.
  document.getElementById('entryBlocks').addEventListener('click', function (e) {
    var hit = e.target.closest(
      '.boat-rudder-entry-editor-block__preview .boat-rudder-entry-image img,' +
      '.boat-rudder-entry-editor-block__preview .boat-rudder-gallery-item');
    if (!hit) return;
    e.stopPropagation();
    e.preventDefault();
    activateBlock(hit.closest('.boat-rudder-entry-editor-block'));
  }, true);

  /* ---- Rich text (paragraph) ---- */
  var _savedRichRange = null;
  function saveRichSelection() {
    var sel = window.getSelection();
    _savedRichRange = sel.rangeCount > 0 ? sel.getRangeAt(0).cloneRange() : null;
  }
  function restoreRichSelection() {
    if (!_savedRichRange) return;
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(_savedRichRange);
  }

  window.applyRichLink = function () {
    var url = prompt('URL:');
    if (!url) return;
    document.execCommand('createLink', false, url);

    // execCommand has no way to set a class on the anchor it creates, so tag
    // whichever link in the active editor is still missing it - since every
    // link already there from a previous use of this button already carries
    // it, that classless one is the one just made.
    var editor = document.activeElement;
    if (editor && editor.classList && editor.classList.contains('boat-rudder-entry-editor__richtext')) {
      editor.querySelectorAll('a[href]:not(.boat-rudder-link__a)').forEach(function (a) {
        a.className = 'boat-rudder-link__a';
      });
      syncRichtext(editor);
    }
  };

  window.toggleSource = function (btn) {
    var lc = btn.closest('.boat-rudder-entry-editor-block__lang-content');
    if (!lc) return;
    var richDiv = lc.querySelector('.boat-rudder-entry-editor__richtext');
    var sourceTA = lc.querySelector('.boat-rudder-entry-editor__source-editor');
    if (!richDiv || !sourceTA) return;
    var isSource = btn.classList.contains('boat-rudder-btn--active');
    if (isSource) {
      richDiv.innerHTML = sourceTA.value;
      syncRichtext(richDiv);
      richDiv.style.display = '';
      sourceTA.style.display = 'none';
      btn.classList.remove('boat-rudder-btn--active');
    } else {
      sourceTA.value = richDiv.innerHTML;
      richDiv.style.display = 'none';
      sourceTA.style.display = '';
      btn.classList.add('boat-rudder-btn--active');
      if (!sourceTA.dataset.srcInit) {
        sourceTA.dataset.srcInit = '1';
        sourceTA.addEventListener('input', function () {
          richDiv.innerHTML = sourceTA.value;
          syncRichtext(richDiv);
        });
      }
    }
  };

  function syncRichtext(div) {
    var block = div.closest('.boat-rudder-entry-editor-block');
    if (!block) return;
    var lang = div.dataset.for;
    var ta = block.querySelector('.boat-rudder-entry-editor-block__lang-content[data-lang="' + lang + '"] [name="text"]');
    if (!ta) return;
    ta.value = div.innerHTML;
    setContentChanged();
  }

  function initParagraphEditors(block) {
    block.querySelectorAll('.boat-rudder-entry-editor-block__lang-content').forEach(function (lc) {
      if (lc.querySelector('.boat-rudder-entry-editor__richtext')) return;
      var ta = lc.querySelector('[name="text"]');
      if (!ta) return;
      var lang = lc.dataset.lang;

      var toolbarHtml =
        '<div class="boat-rudder-entry-editor-block__tools">' +
        '<div class="boat-rudder-entry-editor-toolbar">' +
        '<button class="boat-rudder-entry-editor-toolbar__btn boat-rudder-btn boat-rudder-btn--sm" title="Bold" onmousedown="event.preventDefault();document.execCommand(\'bold\')"><b>B</b></button>' +
        '<button class="boat-rudder-entry-editor-toolbar__btn boat-rudder-btn boat-rudder-btn--sm" title="Italic" onmousedown="event.preventDefault();document.execCommand(\'italic\')"><i>I</i></button>' +
        '<button class="boat-rudder-entry-editor-toolbar__btn boat-rudder-btn boat-rudder-btn--sm" title="Underline" onmousedown="event.preventDefault();document.execCommand(\'underline\')"><u>U</u></button>' +
        '<button class="boat-rudder-entry-editor-toolbar__btn boat-rudder-btn boat-rudder-btn--sm" title="Strikethrough" onmousedown="event.preventDefault();document.execCommand(\'strikeThrough\')"><s>S</s></button>' +
        '<span class="boat-rudder-entry-editor-toolbar__sep"></span>' +
        '<button class="boat-rudder-entry-editor-toolbar__btn boat-rudder-btn boat-rudder-btn--sm" title="Link" onmousedown="event.preventDefault();applyRichLink()">&#128279;</button>' +
        '<button class="boat-rudder-entry-editor-toolbar__btn boat-rudder-btn boat-rudder-btn--sm" title="Remove format" onmousedown="event.preventDefault();document.execCommand(\'removeFormat\')">&#10005;</button>' +
        '</div>' +
        '<div class="boat-rudder-entry-editor-toolbar">' +
        '<button class="boat-rudder-entry-editor-toolbar__btn boat-rudder-btn boat-rudder-btn--sm" title="Align left" onmousedown="event.preventDefault();document.execCommand(\'justifyLeft\')">&#8592;&#9644;</button>' +
        '<button class="boat-rudder-entry-editor-toolbar__btn boat-rudder-btn boat-rudder-btn--sm" title="Align center" onmousedown="event.preventDefault();document.execCommand(\'justifyCenter\')">&#9644;&#9644;</button>' +
        '<button class="boat-rudder-entry-editor-toolbar__btn boat-rudder-btn boat-rudder-btn--sm" title="Align right" onmousedown="event.preventDefault();document.execCommand(\'justifyRight\')">&#9644;&#8594;</button>' +
        '<span class="boat-rudder-entry-editor-toolbar__sep"></span>' +
        '<button class="boat-rudder-entry-editor-toolbar__btn boat-rudder-btn boat-rudder-btn--sm" title="Bullet list" onmousedown="event.preventDefault();document.execCommand(\'insertUnorderedList\')">&#8226;</button>' +
        '<button class="boat-rudder-entry-editor-toolbar__btn boat-rudder-btn boat-rudder-btn--sm" title="Numbered list" onmousedown="event.preventDefault();document.execCommand(\'insertOrderedList\')">1.</button>' +
        '<span class="boat-rudder-entry-editor-toolbar__sep"></span>' +
        '<button class="boat-rudder-entry-editor-toolbar__btn boat-rudder-btn boat-rudder-btn--sm" title="Blockquote" onmousedown="event.preventDefault();document.execCommand(\'formatBlock\',false,\'blockquote\')">&#10077;</button>' +
        '<button class="boat-rudder-entry-editor-toolbar__btn boat-rudder-btn boat-rudder-btn--sm" title="Code block" onmousedown="event.preventDefault();document.execCommand(\'formatBlock\',false,\'pre\')">&lt;/&gt;</button>' +
        '<span class="boat-rudder-entry-editor-toolbar__sep"></span>' +
        '<button class="boat-rudder-entry-editor-toolbar__btn boat-rudder-btn boat-rudder-btn--sm" title="Undo" onmousedown="event.preventDefault();document.execCommand(\'undo\')">&#8617;</button>' +
        '<button class="boat-rudder-entry-editor-toolbar__btn boat-rudder-btn boat-rudder-btn--sm" title="Redo" onmousedown="event.preventDefault();document.execCommand(\'redo\')">&#8618;</button>' +
        '<span class="boat-rudder-entry-editor-toolbar__sep"></span>' +
        '<button class="boat-rudder-entry-editor-toolbar__btn boat-rudder-btn boat-rudder-btn--sm" title="HTML source" onclick="toggleSource(this)">HTML</button>' +
        '</div>' +
        '</div>';

      lc.insertAdjacentHTML('afterbegin', toolbarHtml);

      var div = document.createElement('div');
      div.className = 'boat-rudder-entry-editor__richtext';
      div.contentEditable = 'true';
      div.spellcheck = true;
      div.dataset.for = lang;
      div.dataset.placeholder = 'Write something, or type / to insert a block';
      div.innerHTML = ta.value;

      ta.style.display = 'none';
      lc.insertBefore(div, ta);

      var sourceTA = document.createElement('textarea');
      sourceTA.className = 'boat-rudder-entry-editor__source-editor';
      sourceTA.style.display = 'none';
      lc.insertBefore(sourceTA, ta);

      div.addEventListener('input', function () {
        // Emptied, the browser leaves a lone <br>, which hides the placeholder.
        if (!div.textContent && /^(<br>)?$/i.test(div.innerHTML)) div.innerHTML = '';
        syncRichtext(div);
      });
      div.addEventListener('mouseup', saveRichSelection);
      div.addEventListener('keyup', saveRichSelection);
      div.addEventListener('paste', function (e) {
        e.preventDefault();
        var html = e.clipboardData.getData('text/html');
        var text = e.clipboardData.getData('text/plain');
        if (html) {
          var tmp = document.createElement('div');
          tmp.innerHTML = html;
          tmp.querySelectorAll('[style],[class]').forEach(function (el) {
            el.removeAttribute('style');
            el.removeAttribute('class');
          });
          document.execCommand('insertHTML', false, tmp.innerHTML);
        } else {
          document.execCommand('insertText', false, text);
        }
      });
    });
  }

  /* ---- Paragraph split / merge ---- */

  var PARA_BLOCK_TAGS = /^(P|DIV|UL|OL|BLOCKQUOTE|PRE|H[1-6]|TABLE|FIGURE|HR)$/;

  function htmlBox(html) {
    var d = document.createElement('div');
    d.innerHTML = html || '';
    return d;
  }

  // Whitespace, a <br>, or an element with no text and no picture in it.
  function isEmptyNode(n) {
    if (n.nodeType === 3) return !n.textContent.replace(/[\s ]/g, '');
    if (n.nodeType !== 1) return true;
    if (n.tagName === 'BR') return true;
    if (/^(IMG|HR|IFRAME|VIDEO)$/.test(n.tagName) || n.querySelector('img,hr,iframe,video')) return false;
    return !n.textContent.replace(/[\s ]/g, '');
  }

  // Drops the empty leftovers a cut leaves at either edge (a dangling <br>,
  // an emptied <p>, the &#160; between <br>s).
  function trimEdges(box) {
    while (box.firstChild && isEmptyNode(box.firstChild)) box.removeChild(box.firstChild);
    while (box.lastChild && isEmptyNode(box.lastChild)) box.removeChild(box.lastChild);
  }

  // Where each of a paragraph block's own "paragraphs" begins, as indexes
  // into box.childNodes: runs of top-level content separated by <br>, or a
  // block element (<p>, <ul>...) on its own - how the stored HTML marks them
  // (most of it is plain text with <br>&#160;<br> between paragraphs).
  function segmentStarts(box) {
    var starts = [], inRun = false;
    Array.from(box.childNodes).forEach(function (n, i) {
      if (n.nodeType === 1 && n.tagName === 'BR') { inRun = false; return; }
      if (n.nodeType !== 1 && isEmptyNode(n)) return;
      if (n.nodeType === 1 && PARA_BLOCK_TAGS.test(n.tagName)) { starts.push(i); inRun = false; return; }
      if (!inRun) { starts.push(i); inRun = true; }
    });
    return starts;
  }

  // Splits `html` after its first `keep` paragraphs: [head, tail]. With no
  // more than `keep` of them, everything stays in the head.
  function splitAfterSegments(html, keep) {
    var box = htmlBox(html);
    var starts = segmentStarts(box);
    if (keep >= starts.length) return [html || '', ''];
    var tail = document.createElement('div');
    Array.from(box.childNodes).slice(starts[keep]).forEach(function (n) { tail.appendChild(n); });
    trimEdges(box);
    trimEdges(tail);
    return [box.innerHTML, tail.innerHTML];
  }

  // Two blocks' HTML as one: kept apart as separate paragraphs, with a blank
  // line unless a block element (<p>...) already separates them.
  function joinParagraphHtml(a, b) {
    if (!a.replace(/[\s ]/g, '')) return b;
    if (!b.replace(/[\s ]/g, '')) return a;
    var aEndsBlock = /<\/(p|div|ul|ol|blockquote|pre|h[1-6]|table|figure)>\s*$/i.test(a);
    var bStartsBlock = /^\s*<(p|div|ul|ol|blockquote|pre|h[1-6]|table|figure|hr)[\s>]/i.test(b);
    return a + (aEndsBlock || bStartsBlock ? '' : '<br><br>') + b;
  }

  // A paragraph block's text for `lang`, in its stored textarea and - once
  // the block has been opened - its rich-text editor.
  function setParagraphText(block, lang, html) {
    var lc = block.querySelector('.boat-rudder-entry-editor-block__lang-content[data-lang="' + lang + '"]');
    if (!lc) return;
    var ta = lc.querySelector('[name="text"]');
    if (ta) ta.value = html;
    var rich = lc.querySelector('.boat-rudder-entry-editor__richtext');
    if (rich) rich.innerHTML = html;
  }

  // Merge is only possible from the second paragraph of a run onward.
  function updateMergeButton(block) {
    if (block && block === activeEditBlock) updateContextBar();
  }
  new MutationObserver(function () {
    if (activeEditBlock) updateContextBar();
  }).observe(document.getElementById('entryBlocks'), { childList: true });

  // Moves everything after the cursor into a new paragraph block right
  // below. The cursor sits in one language's text; every other language is
  // cut after the same number of paragraphs (see segmentStarts()) - the
  // paragraph the cursor is in stays above, whole, in the others.
  window.splitParagraph = function (btn) {
    var block = btn.closest('.boat-rudder-entry-editor-block');
    var panel = block.querySelector('.boat-rudder-entry-editor-block__lang-content[data-lang="' + currentLang + '"]');
    var div = panel && panel.querySelector('.boat-rudder-entry-editor__richtext');
    var sel = window.getSelection();
    var range = null;
    if (div && div.style.display !== 'none') {
      if (sel.rangeCount && div.contains(sel.getRangeAt(0).startContainer)) range = sel.getRangeAt(0);
      else if (_savedRichRange && div.contains(_savedRichRange.startContainer)) range = _savedRichRange;
    }
    if (!range) {
      setStatus('Place the cursor in the text where it should split', 'error');
      return;
    }

    var before = document.createRange();
    before.setStart(div, 0);
    before.setEnd(range.startContainer, range.startOffset);
    var after = document.createRange();
    after.setStart(range.startContainer, range.startOffset);
    after.setEnd(div, div.childNodes.length);

    var head = document.createElement('div');
    head.appendChild(before.cloneContents());
    trimEdges(head);
    var tail = document.createElement('div');
    tail.appendChild(after.cloneContents());
    trimEdges(tail);
    if (!head.innerHTML || !tail.innerHTML) {
      setStatus('Place the cursor between text: there must be text before and after it', 'error');
      return;
    }

    var keep = segmentStarts(head).length;
    var parts = {};
    block.querySelectorAll('.boat-rudder-entry-editor-block__lang-content').forEach(function (lc) {
      var lang = lc.dataset.lang;
      var ta = lc.querySelector('[name="text"]');
      parts[lang] = lang === currentLang ? [head.innerHTML, tail.innerHTML]
                                         : splitAfterSegments(ta ? ta.value : '', keep);
    });

    createBlockAfter(block, 'paragraph').then(function (newBlock) {
      if (!newBlock) return;
      Object.keys(parts).forEach(function (lang) {
        setParagraphText(block, lang, parts[lang][0]);
        setParagraphText(newBlock, lang, parts[lang][1]);
      });
      var style = block.querySelector('[name="extra_data"]');
      var newStyle = newBlock.querySelector('[name="extra_data"]');
      if (style && newStyle) newStyle.value = style.value;

      activateBlock(newBlock);
      var rich = newBlock.querySelector('.boat-rudder-entry-editor-block__lang-content[data-lang="' + currentLang + '"] .boat-rudder-entry-editor__richtext');
      if (rich) {
        rich.focus();
        var caret = document.createRange();
        caret.setStart(rich, 0);
        caret.collapse(true);
        sel.removeAllRanges();
        sel.addRange(caret);
      }
      newBlock.scrollIntoView({ block: 'nearest' });
      setContentChanged();
    });
  };

  // Appends this paragraph block's text, in every language, to the end of
  // the paragraph block right above it, and removes this one. Resolves with
  // the block above once merged, or null.
  window.mergeParagraphUp = function (btn) {
    var block = btn.closest('.boat-rudder-entry-editor-block');
    var prev = block.previousElementSibling;
    if (!prev || prev.dataset.type !== 'paragraph') return Promise.resolve(null);

    var joined = {};
    block.querySelectorAll('.boat-rudder-entry-editor-block__lang-content').forEach(function (lc) {
      var lang = lc.dataset.lang;
      var ta = lc.querySelector('[name="text"]');
      var prevTa = prev.querySelector('.boat-rudder-entry-editor-block__lang-content[data-lang="' + lang + '"] [name="text"]');
      joined[lang] = joinParagraphHtml(prevTa ? prevTa.value : '', ta ? ta.value : '');
    });

    return postForm(apiUrl('/blocks/' + block.dataset.blockId + '/delete'), new URLSearchParams()).then(function (data) {
      if (!data.ok) {
        setStatus('Error: ' + data.error, 'error');
        return null;
      }
      Object.keys(joined).forEach(function (lang) { setParagraphText(prev, lang, joined[lang]); });
      if (activeEditBlock === block) activeEditBlock = null;
      block.remove();
      activateBlock(prev);
      setContentChanged();
      // The merged block is already deleted server-side, but its text lives
      // only in this page (in the block above) until saved - save right away
      // so leaving without saving can't lose it.
      saveContent();
      return prev;
    });
  };

  /* ---- Keyboard: writing across blocks ----
     The sheet behaves like one page: Enter in a paragraph is a line break
     (Split in the context bar cuts it in two), Enter at the end of any other
     block starts a paragraph below it (or moves into the empty one already
     there), Backspace at a paragraph's start joins it to the one above, and the arrows cross from block to block. A selected
     block with no field focused (an image, a gallery...) takes Enter and the
     arrows too. */

  // The field the writer types into, in the language being edited: a
  // paragraph's rich-text editor, a title's textarea.
  function inlineField(block) {
    if (!block) return null;
    var panel = block.querySelector('.boat-rudder-entry-editor-block__lang-content[data-lang="' + currentLang + '"]');
    if (!panel) return null;
    return block.dataset.type === 'paragraph'
      ? panel.querySelector('.boat-rudder-entry-editor__richtext')
      : panel.querySelector('textarea[name="text"]');
  }

  function isEmptyParagraph(block) {
    if (!block || block.dataset.type !== 'paragraph') return false;
    var field = inlineField(block);
    return !!field && !Array.from(field.childNodes).some(function (n) { return !isEmptyNode(n); });
  }

  // Puts the caret at the start (atEnd false) or the end of a block's field;
  // a block without one is selected instead.
  function focusBlock(block, atEnd) {
    var field = inlineField(block);
    if (!field || !isInlineType(block.dataset.type)) {
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      activateBlock(block);
      block.scrollIntoView({ block: 'nearest' });
      return;
    }
    field.focus({ preventScroll: true });
    if (field.tagName === 'TEXTAREA') {
      var pos = atEnd ? field.value.length : 0;
      field.setSelectionRange(pos, pos);
    } else {
      var r = document.createRange();
      r.selectNodeContents(field);
      r.collapse(!atEnd);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(r);
    }
    activateBlock(block);
    block.scrollIntoView({ block: 'nearest' });
  }

  // The caret `offset` characters into a rich-text field's text.
  function placeCaretAtText(field, offset) {
    var walker = document.createTreeWalker(field, NodeFilter.SHOW_TEXT);
    var node, r = document.createRange();
    while ((node = walker.nextNode())) {
      if (offset <= node.length) { r.setStart(node, offset); break; }
      offset -= node.length;
    }
    if (!node) { r.selectNodeContents(field); r.collapse(false); }
    r.collapse(true);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(r);
  }

  // A paragraph right below `block` to write in: the empty one already there,
  // or a new one. One at a time - a second Enter while the server is still
  // making it would make two.
  var creatingParagraph = false;
  function paragraphAfter(block) {
    var next = block.nextElementSibling;
    if (isEmptyParagraph(next)) { focusBlock(next, false); return; }
    if (creatingParagraph) return;
    creatingParagraph = true;
    createBlockAfter(block, 'paragraph').then(function (nb) {
      creatingParagraph = false;
      if (nb) focusBlock(nb, false);
    }, function () { creatingParagraph = false; });
  }

  // Whether the caret has only empty content before it / after it in `field`.
  function caretEdges(field, range) {
    var before = document.createRange();
    before.setStart(field, 0);
    before.setEnd(range.startContainer, range.startOffset);
    var after = document.createRange();
    after.setStart(range.endContainer, range.endOffset);
    after.setEnd(field, field.childNodes.length);
    var head = document.createElement('div');
    head.appendChild(before.cloneContents());
    trimEdges(head);
    var tail = document.createElement('div');
    tail.appendChild(after.cloneContents());
    trimEdges(tail);
    return { atStart: !head.innerHTML, atEnd: !tail.innerHTML };
  }

  // Whether the caret sits on the field's first (up) or last (down) line,
  // so an arrow key leaves the block instead of moving inside it.
  function caretOnEdgeLine(field, range, up) {
    if (field.tagName === 'TEXTAREA') {
      var oneLine = field.scrollHeight <= parseFloat(getComputedStyle(field).lineHeight) * 1.5;
      if (oneLine) return true;
      return up ? field.selectionStart === 0 : field.selectionEnd === field.value.length;
    }
    var edges = caretEdges(field, range);
    if (up ? edges.atStart : edges.atEnd) return true;
    var rect = range.getBoundingClientRect();
    if (!rect.height) return false;
    var box = field.getBoundingClientRect();
    var line = parseFloat(getComputedStyle(field).lineHeight) || 24;
    return up ? rect.top - box.top < line * 0.8 : box.bottom - rect.bottom < line * 0.8;
  }

  // Enter inside a list item, a quote or a <pre> of the rich text keeps the
  // browser's own behavior (a new item, a new line...).
  function inNestedBlock(field, range) {
    for (var n = range.startContainer; n && n !== field; n = n.parentNode) {
      if (n.nodeType === 1 && /^(LI|PRE|BLOCKQUOTE)$/.test(n.tagName)) return true;
    }
    return false;
  }

  function onParagraphKey(e, block, field) {
    var sel = window.getSelection();
    if (!sel.rangeCount) return;
    var range = sel.getRangeAt(0);

    // Enter is a line break inside the paragraph, as <br> like the stored
    // text has them (the browser would wrap the line in a <div>). In a list
    // item, a quote or a <pre> the browser's own Enter stays.
    if (e.key === 'Enter') {
      if (inNestedBlock(field, range)) return;
      e.preventDefault();
      document.execCommand('insertLineBreak');
      return;
    }

    if (e.key === 'Backspace' && sel.isCollapsed && caretEdges(field, range).atStart) {
      var prev = block.previousElementSibling;
      if (!prev) return;
      e.preventDefault();
      if (prev.dataset.type === 'paragraph') {
        var prevField = inlineField(prev);
        var joinAt = prevField ? prevField.textContent.length : 0;
        mergeParagraphUp(block).then(function (merged) {
          if (!merged) return;
          var f = inlineField(merged);
          if (!f) return;
          f.focus({ preventScroll: true });
          placeCaretAtText(f, joinAt);
        });
      } else if (isEmptyParagraph(block)) {
        removeComponent(block);
        focusBlock(prev, true);
      } else {
        focusBlock(prev, true);
      }
      return;
    }

    if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && !e.shiftKey && !e.altKey && !e.metaKey && !e.ctrlKey) {
      var up = e.key === 'ArrowUp';
      var target = up ? block.previousElementSibling : block.nextElementSibling;
      if (target && caretOnEdgeLine(field, range, up)) {
        e.preventDefault();
        focusBlock(target, up);
      }
    }
  }

  function onTitleKey(e, block, field) {
    if (e.key === 'Enter') {
      // A heading is one line: Enter goes on to the text under it.
      e.preventDefault();
      paragraphAfter(block);
      return;
    }
    if (e.key === 'Backspace' && !field.value && block.previousElementSibling) {
      e.preventDefault();
      var prev = block.previousElementSibling;
      removeComponent(block);
      focusBlock(prev, true);
      return;
    }
    if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && !e.shiftKey && !e.altKey && !e.metaKey && !e.ctrlKey) {
      var up = e.key === 'ArrowUp';
      var target = up ? block.previousElementSibling : block.nextElementSibling;
      if (target && caretOnEdgeLine(field, null, up)) {
        e.preventDefault();
        focusBlock(target, up);
      }
    }
  }

  // Code, terminal, list and HTML keep Enter for their own new lines: Ctrl
  // (or Cmd) + Enter leaves them for a paragraph below - and so does Enter
  // on an empty last line of code, a session or a list, which is dropped.
  function onMultilineKey(e, block, field) {
    if (e.key !== 'Enter' || e.shiftKey || e.altKey) return;
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      paragraphAfter(block);
      return;
    }
    if (block.dataset.type === 'generic') return;
    var v = field.value;
    if (field.selectionStart === v.length && field.selectionEnd === v.length && /\n[ \t]*$/.test(v)) {
      e.preventDefault();
      field.value = v.replace(/\n[ \t]*$/, '');
      onBlockInput(field);
      paragraphAfter(block);
    }
  }

  document.getElementById('entryBlocks').addEventListener('keydown', function (e) {
    if (e.isComposing || e.keyCode === 229) return;
    var block = e.target.closest('.boat-rudder-entry-editor-block');
    if (!block) return;
    var type = block.dataset.type;
    if (type === 'paragraph' && e.target.classList.contains('boat-rudder-entry-editor__richtext')) {
      onParagraphKey(e, block, e.target);
    } else if (type === 'title' && e.target.name === 'text') {
      onTitleKey(e, block, e.target);
    } else if (/^(code-text|terminal|list|generic)$/.test(type) && e.target.tagName === 'TEXTAREA' && e.target.name === 'text') {
      onMultilineKey(e, block, e.target);
    }
  });

  // A selected block with no field focused: Enter writes below it, the
  // arrows move to its neighbours.
  document.addEventListener('keydown', function (e) {
    var block = activeEditBlock;
    if (!block || isInlineType(block.dataset.type) || overlayOpen()) return;
    var focused = document.activeElement;
    if (focused && focused !== document.body && focused.closest('input, textarea, select, button, [contenteditable="true"], .boat-rudder-entry-editor-context, .boat-rudder-entry-editor__topbar, #editorSettings')) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Enter') { e.preventDefault(); paragraphAfter(block); }
    else if (e.key === 'ArrowUp' && block.previousElementSibling) { e.preventDefault(); focusBlock(block.previousElementSibling, true); }
    else if (e.key === 'ArrowDown' && block.nextElementSibling) { e.preventDefault(); focusBlock(block.nextElementSibling, false); }
  });

  // that block if it is a paragraph, in a new paragraph otherwise. Deferred,
  // so the document's click handler closes the old block first.
  document.querySelector('.boat-rudder-entry-editor__main').addEventListener('click', function (e) {
    if (e.target.closest('.boat-rudder-entry-editor-block, .boat-rudder-entry-editor-add-block__btn, #addBlockMenu')) return;
    var blocksEl = document.getElementById('entryBlocks');
    var last = blocksEl.lastElementChild;
    if (last && e.clientY < last.getBoundingClientRect().bottom) return;
    setTimeout(function () {
      if (last && last.dataset.type === 'paragraph') focusBlock(last, true);
      else if (last) paragraphAfter(last);
      else createBlockAfter(null, 'paragraph').then(function (nb) { if (nb) focusBlock(nb, false); });
    }, 0);
  });

  /* ---- Block types: switching, "/" menu, Markdown shortcuts ---- */

  // "paragraph", "title:2", "list:ol" - the context bar's type <select> value.
  function blockVariantValue(block) {
    var extra = (block.querySelector('[name="extra_data"]') || {}).value || '';
    if (block.dataset.type === 'title') return 'title:' + (parseInt(extra) || 2);
    if (block.dataset.type === 'list') return 'list:' + (extra === 'ol' ? 'ol' : 'ul');
    return block.dataset.type;
  }

  // A heading's level, a list's kind.
  function applyVariant(block, variant) {
    var hidden = block.querySelector('[name="extra_data"]');
    if (!hidden || !variant) return;
    hidden.value = variant;
    if (block.dataset.type === 'title') { initBlockHeadingBtns(block); autosizeTitle(block); }
    if (block.dataset.type === 'list') { initListBlock(block); refreshBlockPreview(block); }
  }

  // A paragraph's HTML as plain lines: one per <br> or block element.
  function htmlLines(html) {
    var box = htmlBox(html);
    box.querySelectorAll('br').forEach(function (br) { br.replaceWith('\n'); });
    box.querySelectorAll('p, div, li, h1, h2, h3, h4, h5, h6, blockquote, pre').forEach(function (el) { el.append('\n'); });
    return box.textContent.split('\n').map(function (l) { return l.replace(/[\s ]+/g, ' ').trim(); }).filter(Boolean);
  }

  // One language's stored text, carried from a `from` block to a `to` one.
  function convertText(from, to, text) {
    if (!text) return '';
    var lines = from === 'paragraph' ? htmlLines(text)
              : text.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
    if (to === 'paragraph') return lines.map(escapeHtml).join('<br>');
    if (to === 'title') return lines.join(' ');
    if (to === 'list') return lines.join('\n');
    return '';
  }

  // Turns `block` into a `type` block (`variant`: a heading level, a list
  // kind), its text kept in every language when both are text blocks.
  // Same type: only the variant changes. Resolves with the block now there.
  function convertBlock(block, type, variant) {
    if (block.dataset.type === type) {
      applyVariant(block, variant);
      setContentChanged();
      return Promise.resolve(block);
    }
    var from = block.dataset.type;
    var texts = {};
    langs.forEach(function (l) {
      var f = langField(block, l, 'text');
      texts[l] = f ? f.value : '';
    });
    return createBlockAfter(block, type).then(function (nb) {
      if (!nb) return null;
      langs.forEach(function (l) {
        var text = convertText(from, type, texts[l]);
        if (type === 'paragraph') setParagraphText(nb, l, text);
        else {
          var f = langField(nb, l, 'text');
          if (f && /^(title|list)$/.test(type)) f.value = text;
        }
      });
      applyVariant(nb, variant);
      if (activeEditBlock === block) activeEditBlock = null;
      block.hidden = true;           // gone at once; the server delete follows
      removeComponent(block);
      refreshBlockPreview(nb);
      return nb;
    });
  }

  // Where the writer goes on in a block just made by a switch, "/" or a
  // shortcut: its text, its first field - or the media library, for the
  // blocks that are nothing but pictures.
  function enterBlock(block) {
    var type = block.dataset.type;
    if (isInlineType(type)) { focusBlock(block, true); return; }
    activateBlock(block);
    block.scrollIntoView({ block: 'nearest' });
    if (type === 'image') { openImageGallery(block); return; }
    if (type === 'gallery') { openGalleryForBlock(block); return; }
    if (type === 'separator') { paragraphAfter(block); return; }
    var field = block.querySelector('.boat-rudder-entry-editor-block__lang-content--active textarea, ' +
      '.boat-rudder-entry-editor-block__body input[type="text"]:not([name="extra_data"]), ' +
      '.boat-rudder-entry-editor__table-cell');
    if (field && field.offsetParent) field.focus();
  }

  window.switchActiveBlockType = function (sel) {
    var block = activeEditBlock;
    if (!block) return;
    var parts = sel.value.split(':');
    convertBlock(block, parts[0], parts[1]).then(function (nb) {
      if (nb && nb !== block) enterBlock(nb);
      else updateContextBar();
    });
  };

  // The "/" menu: typed alone at the start of an empty paragraph, it lists
  // the blocks; the letters after it filter them (keywords too), the arrows
  // and Enter pick one, Escape or deleting the "/" closes it. The paragraph
  // becomes the picked block.
  var SLASH_ITEMS = [
    ['&para;', 'Paragraph', 'paragraph', '', 'text p'],
    ['H1', 'Heading 1', 'title', '1', 'title h1 heading'],
    ['H2', 'Heading 2', 'title', '2', 'title h2 heading subtitle'],
    ['H3', 'Heading 3', 'title', '3', 'title h3 heading'],
    ['&bull;', 'Bulleted list', 'list', 'ul', 'ul bullet list'],
    ['1.', 'Numbered list', 'list', 'ol', 'ol number list ordered'],
    ['&#9633;', 'Image', 'image', '', 'picture photo img'],
    ['&#9632;', 'Gallery', 'gallery', '', 'photos pictures images'],
    ['&lt;/&gt;', 'Code', 'code-text', '', 'code pre source snippet'],
    ['&gt;_', 'Terminal', 'terminal', '', 'shell console command dos powershell'],
    ['&#9974;', 'Table', 'table', '', 'grid rows columns'],
    ['&#9135;', 'Separator', 'separator', '', 'hr divider line rule'],
    ['&#128279;', 'Link', 'link', '', 'url button'],
    ['&#9654;', 'YouTube', 'youtube-embed', '', 'video embed'],
    ['&#9835;', 'Social', 'social-networks', '', 'network profile'],
    ['&#9998;', 'Byline', 'byline', '', 'author date'],
    ['&#9965;', 'HTML', 'generic', '', 'generic raw embed html']
  ];
  var slash = null;   // { block, field, menu, items, index }

  function closeSlashMenu() {
    if (!slash) return false;
    slash.menu.remove();
    slash = null;
    return true;
  }

  function renderSlashMenu(query) {
    var q = query.toLowerCase();
    slash.items = SLASH_ITEMS.filter(function (it) {
      return !q || (it[1] + ' ' + it[4]).toLowerCase().split(/\s+/).some(function (w) { return w.indexOf(q) === 0; });
    });
    slash.index = Math.min(slash.index, Math.max(slash.items.length - 1, 0));
    slash.menu.innerHTML = slash.items.length
      ? slash.items.map(function (it, i) {
          return '<button type="button" class="boat-rudder-entry-editor-slash__item' +
            (i === slash.index ? ' boat-rudder-entry-editor-slash__item--active' : '') + '" data-index="' + i + '">' +
            '<span class="boat-rudder-entry-editor-slash__icon">' + it[0] + '</span>' + it[1] + '</button>';
        }).join('')
      : '<div class="boat-rudder-entry-editor-slash__none">No block matches</div>';
    var active = slash.menu.querySelector('.boat-rudder-entry-editor-slash__item--active');
    if (active) active.scrollIntoView({ block: 'nearest' });
  }

  function openSlashMenu(block, field) {
    if (!slash || slash.block !== block) {
      closeSlashMenu();
      var menu = document.createElement('div');
      menu.className = 'boat-rudder-entry-editor-slash';
      menu.setAttribute('role', 'listbox');
      // Keeps the caret in the paragraph while an item is clicked.
      menu.addEventListener('mousedown', function (e) { e.preventDefault(); });
      menu.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-index]');
        if (btn) pickSlashItem(parseInt(btn.dataset.index));
      });
      document.body.appendChild(menu);
      slash = { block: block, field: field, menu: menu, items: [], index: 0 };
    }
    var r = field.getBoundingClientRect();
    var below = window.innerHeight - r.bottom > 260;
    slash.menu.style.left = Math.min(r.left + 14, window.innerWidth - 250) + 'px';
    slash.menu.style.top = below ? (r.bottom + 4) + 'px' : '';
    slash.menu.style.bottom = below ? '' : (window.innerHeight - r.top + 4) + 'px';
    renderSlashMenu(field.textContent.replace(/ /g, ' ').slice(1));
  }

  function pickSlashItem(i) {
    if (!slash || !slash.items[i]) return;
    var it = slash.items[i], block = slash.block;
    closeSlashMenu();
    setParagraphText(block, currentLang, '');
    if (it[2] === 'paragraph') { focusBlock(block, false); setContentChanged(); return; }
    convertBlock(block, it[2], it[3]).then(function (nb) { if (nb) enterBlock(nb); });
  }

  // Typed alone in an empty paragraph, these turn it into another block.
  var MARKDOWN_SHORTCUTS = [
    [/^# $/, 'title', '1'], [/^## $/, 'title', '2'], [/^### $/, 'title', '3'],
    [/^[-*] $/, 'list', 'ul'], [/^1[.)] $/, 'list', 'ol'],
    [/^```$/, 'code-text', ''], [/^---$/, 'separator', '']
  ];

  document.getElementById('entryBlocks').addEventListener('input', function (e) {
    var field = e.target;
    if (!field.classList || !field.classList.contains('boat-rudder-entry-editor__richtext')) return;
    var block = field.closest('.boat-rudder-entry-editor-block');
    var text = field.textContent.replace(/ /g, ' ');
    var onlyText = !field.querySelector('img, iframe, video, hr, table');

    if (onlyText && /^\/[\w-]*$/.test(text)) openSlashMenu(block, field);
    else closeSlashMenu();

    if (!onlyText || text.length > 4) return;
    for (var i = 0; i < MARKDOWN_SHORTCUTS.length; i++) {
      var sc = MARKDOWN_SHORTCUTS[i];
      if (!sc[0].test(text)) continue;
      setParagraphText(block, currentLang, '');
      convertBlock(block, sc[1], sc[2]).then(function (nb) { if (nb) enterBlock(nb); });
      return;
    }
  });

  // Capture phase: the "/" menu's keys come before the paragraph's own
  // (Enter would otherwise split it).
  document.getElementById('entryBlocks').addEventListener('keydown', function (e) {
    if (!slash || e.target !== slash.field) return;
    var n = slash.items.length;

    e.stopPropagation();

    if (slash && e.target === slash.field) closeSlashMenu();
  });
  document.querySelector('.boat-rudder-entry-editor__main').addEventListener('scroll', closeSlashMenu);

  /* ---- Heading level ---- */
  window.setHeadingLevel = function (btn, level) {
    var block = btn.closest('.boat-rudder-entry-editor-block');
    if (!block) return;
    var hidden = block.querySelector('[name="extra_data"]');
    if (hidden) { hidden.value = level; }
    block.querySelectorAll('.boat-rudder-entry-editor__heading-btn').forEach(function (b) {
      b.classList.toggle('boat-rudder-btn--active', parseInt(b.dataset.level) === level);
    });
    block.dataset.level = level;
    autosizeTitle(block);
    setContentChanged();
  };

  function initBlockHeadingBtns(block) {
    var hidden = block.querySelector('[name="extra_data"]');
    if (!hidden) return;
    var level = parseInt(hidden.value) || 2;
    block.querySelectorAll('.boat-rudder-entry-editor__heading-btn').forEach(function (b) {
      b.classList.toggle('boat-rudder-btn--active', parseInt(b.dataset.level) === level);
    });
    block.dataset.level = level;
  }

  // A title is a one-line textarea drawn as its heading: it grows with its
  // text instead of scrolling. Only the visible language's box can be
  // measured, so setLang() runs it again.
  function autosizeTitle(block) {
    if (!block || block.dataset.type !== 'title') return;
    block.querySelectorAll('.boat-rudder-entry-editor-block__lang-content--active [name="text"]').forEach(function (ta) {
      ta.style.height = 'auto';
      ta.style.height = ta.scrollHeight + 'px';
    });
  }

  // Paragraphs and titles are editable on the sheet from the start, not
  // only once opened.
