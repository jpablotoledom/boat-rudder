<section class="boat-rudder__dashboard">
<nav class="boat-rudder__dashboard__breadcrumb" aria-label="Breadcrumb">
  <ol><li><a href="/dashboard">Dashboard</a></li></ol>
</nav>
<div class="boat-rudder__dashboard__panel-header">
  <h1>All entries</h1>
  <div class="boat-rudder__dashboard__panel-actions">
    <form method="POST" action="/dashboard/entries/new">
      <button class="boat-rudder__dashboard__button boat-rudder__dashboard__button--primary" type="submit">+ New entry</button>
    </form>
  </div>
</div>
<div class="boat-rudder__dashboard__table-scroll">
<table class="boat-rudder__dashboard__table">
  <thead>
    <tr>
      <th>Image</th>
      <th>Title</th>
      <th>Summary</th>
      <th>Author</th>
      <th>Date</th>
      <th>Categories</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
%s
  </tbody>
</table>
</div>
</section>
