<section class="boat-rudder__dashboard">
  <h1>Languages</h1>
%s
  <table class="boat-rudder__dashboard__table">
    <thead>
      <tr>
        <th>Code</th>
        <th>Name</th>
        <th>Default</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
%s
    </tbody>
  </table>
  <form class="boat-rudder__dashboard__inline-form" method="POST" action="/dashboard/languages/add">
    <label for="code">Add language</label>
    <select class="boat-rudder__dashboard__input" id="code" name="code">
%s
    </select>
    <button class="boat-rudder__dashboard__button" type="submit">Add</button>
  </form>
  <p><a href="/dashboard">Back to dashboard</a></p>
</section>
