<li id="media-directory-row_%s" class="boat-rudder__media__dir-item" onclick="selectDirectory('%s')">
  <div id="media-directory-label_%s" name="media-directory-label">%s</div>
  <input id="media-directory_%s" name="media-directory" onblur="renameDirectory()" onkeypress="return validarCaracter(event)" class="none" type="text" value="%s">
  <input id="media-directory-name_%s" type="hidden" value="%s">
  <input name="media-directory-id" type="hidden" value="%s">
  <input name="media-directory-parent" type="hidden" value="%s">
  <input name="media-directory-author" type="hidden" value="%s">
  <input name="media-directory-author-id" type="hidden" value="%s">
</li>
