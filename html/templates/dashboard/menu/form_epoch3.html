<section class="boat-rudder__dashboard">
  <h1>Menu item</h1>
%s
  <form class="boat-rudder__dashboard__form" method="POST" action="%s">
    <div class="boat-rudder__dashboard__form-row">
      <label for="link">Link</label>
      <input class="boat-rudder__dashboard__input" type="text" id="link" name="link" value="%s">
    </div>
    <div class="boat-rudder__dashboard__form-row">
      <label for="order">Order</label>
      <input class="boat-rudder__dashboard__input" type="number" id="order" name="order" value="%d">
    </div>
    <div class="boat-rudder__dashboard__form-row">
      <label for="enabled">
        <input type="checkbox" id="enabled" name="enabled" value="true"%s>
        Enabled
      </label>
    </div>
%s
    <div class="boat-rudder__dashboard__button-container">
      <button class="boat-rudder__dashboard__button" type="submit">Save</button>
    </div>
  </form>
  <p><a href="/dashboard/menu">Back to menu</a></p>
</section>
