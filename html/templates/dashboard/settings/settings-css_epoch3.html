<section class="boat-rudder-dashboard">
  <nav class="boat-rudder-dashboard__breadcrumb" aria-label="Breadcrumb">
    <ol><li><a href="/dashboard">Dashboard</a></li><li><a href="/dashboard/settings">Site settings</a></li><li><a href="/dashboard/settings/themes">Themes</a></li><li><a href="/dashboard/settings/themes/%1$s">%1$s</a></li></ol>
  </nav>
  <h1>CSS (epoch 3)</h1>
  <p class="boat-rudder-dashboard__theme-badge boat-rudder-badge">Theme: <strong>%1$s</strong></p>
  <nav class="boat-rudder-tabs" aria-label="Stylesheet">
    <a class="boat-rudder-tabs__tab%2$s" href="/dashboard/settings/themes/%1$s/css">Public site</a>
    <a class="boat-rudder-tabs__tab%3$s" href="/dashboard/settings/themes/%1$s/admin-css">Admin (login and dashboard)</a>
  </nav>
  <p>%4$s</p>
  <form method="POST" action="/dashboard/settings/themes/%1$s/%5$s" class="boat-rudder-dashboard__form boat-rudder-card">
    <textarea class="boat-rudder-dashboard__textarea" name="css" rows="30" spellcheck="false">%6$s</textarea>
    <button class="boat-rudder-btn boat-rudder-btn--primary" type="submit">Save</button>
  </form>
  <form method="POST" action="/dashboard/settings/themes/%1$s/%5$s/restore"
        class="boat-rudder-dashboard__form boat-rudder-card"%7$s
        onsubmit="return confirm('Restore the original stylesheet? Your customizations will be lost.');">
    <button class="boat-rudder-btn" type="submit">Restore original</button>
  </form>
</section>
