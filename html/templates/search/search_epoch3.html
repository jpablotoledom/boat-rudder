<section class="boat-rudder-search">
  <h1 class="boat-rudder-search__title">Search</h1>
  <form class="boat-rudder-search__form" action="/search" method="get" role="search">%4$s
    <input class="boat-rudder-search__input" type="search" name="q" value="%1$s" maxlength="100"
           placeholder="Search the blog and the pages" aria-label="Search the blog and the pages">
    <button class="boat-rudder-search__btn" type="submit">Search</button>
  </form>
  <p class="boat-rudder-search__summary">%2$s</p>
  <ol class="boat-rudder-search__results">
%3$s
  </ol>
</section>
