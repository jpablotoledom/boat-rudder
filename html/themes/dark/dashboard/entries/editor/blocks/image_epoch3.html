    <div class="boat-rudder__entry-editor__block" data-block-id="%s" data-type="image">
      <div class="boat-rudder__entry-editor__block-toolbar">
        <span class="boat-rudder__entry-editor__block-type">Image</span>
        <div class="boat-rudder__entry-editor__block-actions">
          <button type="button" onclick="moveBlockUp(this)">&uarr;</button>
          <button type="button" onclick="moveBlockDown(this)">&darr;</button>
          <button type="button" onclick="removeComponent(this)">Remove</button>
        </div>
      </div>
      <div class="boat-rudder__entry-editor__block-fields">
%s
      </div>
      <div class="boat-rudder__entry-editor__block-extra">
        <label>Caption / alt text</label>
        <input class="boat-rudder__dashboard__input" type="text" name="extra_data" value="%s" oninput="onBlockInput(this)">
      </div>
      <div class="boat-rudder__entry-editor__block-preview"></div>
    </div>
