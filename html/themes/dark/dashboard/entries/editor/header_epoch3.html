    <div class="trc-meta-section" id="headerSidebar">
      <div class="trc-meta-section__title">Post Header</div>

      <div class="trc-meta-group">
        <label>Cover image</label>
        <div class="trc-img-preview" id="header-img-preview">
          <span class="trc-img-preview__placeholder">No image</span>
        </div>
        <button class="trc-meta-btn" type="button" onclick="openGallery(['headerImageUrl'], '', 'header')">Select image</button>
        <input name="image_url" id="headerImageUrl" type="text" value="%s" oninput="setContentChanged()" placeholder="Image URL" style="display:none">
      </div>

      <div class="trc-meta-group">
        <label for="headerDate">Date</label>
        <input name="date" id="headerDate" type="date" value="%s" oninput="setContentChanged()">
      </div>

      <div id="headerLangPanels">
%s
      </div>
    </div>
