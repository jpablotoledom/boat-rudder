    <div class="trc-meta-section" id="metaSidebar">
      <div class="trc-meta-section__title">Entry Settings</div>

      <div class="trc-meta-group">
        <label for="entryLink">URL slug</label>
        <input name="link" id="entryLink" type="text" value="%s" oninput="setContentChanged()">
      </div>

      <div class="trc-meta-group">
        <label for="entryType">Type</label>
        <select name="type" id="entryType" onchange="setContentChanged()">
          <option value="page"%s>Page</option>
          <option value="blog"%s>Blog</option>
        </select>
      </div>

      <div class="trc-meta-group">
        <label>Categories</label>
        <select name="categories" id="entryCategories" multiple size="6" onchange="setContentChanged()">
%s
        </select>
      </div>

      <input name="enabled" type="checkbox"%s style="display:none" onchange="setContentChanged()">
    </div>
