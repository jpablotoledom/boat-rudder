<div class="trc-media__photo" id="media-photo--%s">

  <div class="trc-media__photo-name">%s</div>
  <input type="checkbox" id="media-item-select--%s" name="media-item-select" value="1">
  <input type="hidden" id="media-item-id--%s" name="media-item-id" value="%s">
  <input type="hidden" id="media-item-url--%s" name="media-item-url" value="/content/%s">
