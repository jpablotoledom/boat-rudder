<tr>
  <td width="100%%">
    <table border="1" bordercolor="%10$s" cellspacing="0" cellpadding="10" width="100%%" bgcolor-x="%11$s" background="/themes/light/assets/blog-list/background-blog-list-xl.gif">
      <tr>
        <td valign="top">
          <table width="100%%" border="0" cellspacing="0" cellpadding="0">
            <tr>
              <!-- Thumbnail and text sit in two cells, not an align="left"
                   float: Netscape 4 does not keep a float inside its cell,
                   so it escaped into the byline row below and printed the
                   author across the picture. -->
              <td valign="top" width="190">
                <a href="%2$s">
                  <img src="%1$s" alt="" width="180" border="0">
                </a>
              </td>
              <td> </td>
              <td valign="top">
                <a href="%2$s">
                  <h2 style="margin-top: 0; margin-bottom: 5px;"><font face="Arial, Helvetica">%3$s</font></h2>
                </a>
                <font face="Arial, Helvetica" style="font-size: 13px; line-height: normal;">%4$s</font>
              </td>
            </tr>
            <tr>
              <td colspan="3">
                <table width="100%%" border="0" cellspacing="0" cellpadding="0">
                  <tr><td height="10"></td></tr>
                  <tr>
                    <td align="left"><font face="Arial, Helvetica" color="%5$s">%6$s</font></td>
                    <td align="center">%7$s</td>
                    <td align="right"><font face="Arial, Helvetica" color="%8$s">%9$s</font></td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
    <table>
      <tr>
        <td height="20"></td>
      </tr>
    </table>
  </td>
</tr>
